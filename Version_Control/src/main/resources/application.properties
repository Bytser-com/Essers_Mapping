spring.application.name=version-control-service
server.port=8080

# SFTP Configuration
sftp.host=${SFTP_SHARED_HOST:localhost}
sftp.port=${SFTP_SHARED_PORT:22}
sftp.user=${SFTP_SHARED_USER:sftpuser}
sftp.password=${SFTP_SHARED_PASSWORD:sftppass}
sftp.base-path=${SFTP_SHARED_REMOTE_DIR:/Proposals}
sftp.allow-unknown-keys=${SFTP_ALLOW_UNKNOWN_KEYS:true}
