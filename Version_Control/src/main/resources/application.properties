spring.application.name=version-control-service
server.port=8080

# SFTP Configuration
sftp.host=${SFTP_HOST:localhost}
sftp.port=${SFTP_PORT:22}
sftp.user=${SFTP_USER:sftpuser}
sftp.password=${SFTP_PASSWORD:sftppass}
sftp.base-path=${SFTP_BASE_PATH:/Proposals}
sftp.allow-unknown-keys=${SFTP_ALLOW_UNKNOWN_KEYS:true}
