---
# ==============================================================================
# COMMON TASKS: SECURITY & HARDENING
# ==============================================================================

- name: Ensure SSH configuration drop-in and privilege separation directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "/etc/ssh/sshd_config.d", mode: "0755" }
    - { path: "/run/sshd", mode: "0755" }

- name: Deploy hardened SSH daemon configuration
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-ansible-hardening.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart sshd

- name: Configure Fail2Ban SSH jail
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  when: security_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Ensure Fail2Ban service is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: security_fail2ban_enabled | bool

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: security_unattended_upgrades_enabled | bool
