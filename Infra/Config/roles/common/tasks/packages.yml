---
# ==============================================================================
# COMMON TASKS: PACKAGES & PROXMOX GUEST AGENT
# ==============================================================================

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ common_apt_cache_valid_time }}"
    lock_timeout: "{{ common_apt_lock_timeout }}"

- name: Perform safe system package upgrade
  ansible.builtin.apt:
    upgrade: safe
    autoremove: true
    autoclean: true
    lock_timeout: "{{ common_apt_lock_timeout }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: common_upgrade_packages | bool

- name: Install baseline system packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present
    lock_timeout: "{{ common_apt_lock_timeout }}"
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install Proxmox QEMU Guest Agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    lock_timeout: "{{ common_apt_lock_timeout }}"
  when: proxmox_qemu_guest_agent_enabled | bool
  notify: Restart qemu-guest-agent

- name: Ensure QEMU Guest Agent service is enabled and running
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: proxmox_qemu_guest_agent_enabled | bool

- name: Enable periodic SSD fstrim timer for Proxmox thin provisioning
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started
  when: proxmox_fstrim_timer_enabled | bool
