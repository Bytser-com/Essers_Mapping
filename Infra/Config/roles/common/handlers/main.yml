---
# ==============================================================================
# ROLE HANDLERS: common
# ==============================================================================

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: restarted
