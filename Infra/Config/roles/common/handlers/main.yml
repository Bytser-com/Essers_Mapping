---
# ==============================================================================
# ROLE HANDLERS: common
# ==============================================================================

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted
  when: not (ansible_check_mode and (base_packages_pkg.changed | default(false)))

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: not (ansible_check_mode and (base_packages_pkg.changed | default(false)))

- name: Restart qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: restarted
  when: not (ansible_check_mode and (qemu_guest_agent_pkg.changed | default(false)))
