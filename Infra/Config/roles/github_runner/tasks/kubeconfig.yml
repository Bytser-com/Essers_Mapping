---
# ==============================================================================
# GITHUB_RUNNER TASKS: KUBERNETES CLUSTER KUBECONFIG SETUP
# Fetches /etc/kubernetes/admin.conf from the Control Plane node and configures
# ~/.kube/config on the runner VM so kubectl/Helm can manage the K8s cluster.
# ==============================================================================

- name: Check if Kubernetes admin.conf exists on Control Plane '{{ groups['k8s_masters'][0] }}'
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  register: runner_master_admin_conf
  when:
    - runner_install_kubectl | bool
    - runner_configure_kubeconfig | bool
    - groups['k8s_masters'] is defined
    - groups['k8s_masters'] | length > 0

- name: Ensure Kubernetes Control Plane is initialized before fetching kubeconfig
  ansible.builtin.assert:
    that:
      - runner_master_admin_conf.stat.exists | default(false)
    fail_msg: >-
      /etc/kubernetes/admin.conf was not found on Control Plane '{{ groups['k8s_masters'][0] }}'.
      Ensure the Kubernetes Control Plane (playbooks/kubernetes.yml) is initialized before configuring runner kubeconfig.
  when:
    - runner_install_kubectl | bool
    - runner_configure_kubeconfig | bool
    - not ansible_check_mode

- name: Fetch admin.conf from Kubernetes Control Plane '{{ groups['k8s_masters'][0] }}'
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['k8s_masters'][0] }}"
  register: runner_slurped_admin_conf
  no_log: true
  when:
    - runner_install_kubectl | bool
    - runner_configure_kubeconfig | bool
    - not ansible_check_mode
    - runner_master_admin_conf.stat.exists | default(false)

- name: Ensure ~/.kube directory exists for runner users
  ansible.builtin.file:
    path: "{{ item.home }}/.kube"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.group }}"
    mode: "0700"
  loop: "{{ runner_kubeconfig_users }}"
  loop_control:
    label: "{{ item.user }} ({{ item.home }}/.kube)"
  when:
    - runner_install_kubectl | bool
    - runner_configure_kubeconfig | bool

- name: Deploy Kubernetes cluster kubeconfig to runner users
  ansible.builtin.copy:
    content: >-
      {{
        (runner_slurped_admin_conf.content | b64decode)
        | regex_replace(
            'server:\s*https://[^\s]+',
            'server: https://' ~ hostvars[groups['k8s_masters'][0]]['ansible_host'] ~ ':' ~ ((hostvars[groups['k8s_masters'][0]]['k8s_apiserver_bind_port'] | default(6443)) | string)
          )
      }}
    dest: "{{ item.home }}/.kube/config"
    owner: "{{ item.user }}"
    group: "{{ item.group }}"
    mode: "0600"
  loop: "{{ runner_kubeconfig_users }}"
  loop_control:
    label: "{{ item.user }} ({{ item.home }}/.kube/config)"
  no_log: true
  when:
    - runner_install_kubectl | bool
    - runner_configure_kubeconfig | bool
    - not ansible_check_mode
    - runner_master_admin_conf.stat.exists | default(false)

- name: Verify runner VM can reach the Kubernetes cluster via kubectl
  ansible.builtin.command:
    cmd: kubectl get nodes
  become: true
  become_user: "{{ github_runner_user }}"
  environment:
    KUBECONFIG: "/home/{{ github_runner_user }}/.kube/config"
  changed_when: false
  when:
    - runner_install_kubectl | bool
    - runner_configure_kubeconfig | bool
    - not ansible_check_mode
    - runner_master_admin_conf.stat.exists | default(false)
