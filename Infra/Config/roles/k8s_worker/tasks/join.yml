---
# ==============================================================================
# K8S_WORKER TASKS: CLUSTER JOIN
# ==============================================================================

- name: Check if worker node has already joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_kubelet_conf

- name: Verify join command was generated by Control Plane
  ansible.builtin.assert:
    that:
      - hostvars[groups['k8s_masters'][0]]['k8s_join_command'] is defined
      - hostvars[groups['k8s_masters'][0]]['k8s_join_command'] | length > 0
    fail_msg: "k8s_join_command is missing on control plane host '{{ groups['k8s_masters'][0] }}'."
  when: not k8s_kubelet_conf.stat.exists

- name: Join worker node to Kubernetes Control Plane
  ansible.builtin.command:
    cmd: "{{ hostvars[groups['k8s_masters'][0]]['k8s_join_command'] }} --node-name {{ hostname_short | lower }}"
    creates: /etc/kubernetes/kubelet.conf
  when: not k8s_kubelet_conf.stat.exists

- name: Refresh kubelet.conf stat after cluster join
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_kubelet_conf

- name: Ensure kubelet service is enabled and running on worker
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
