---
# ==============================================================================
# K8S_COMMON TASKS: PACKAGE INSTALLATION & VERSION PINNING
# ==============================================================================

- name: Install version-pinned Kubernetes packages (kubelet, kubeadm, kubectl)
  ansible.builtin.apt:
    name: >-
      {{
        k8s_packages
        if (not (k8s_package_version | default('')) or '*' in k8s_package_version)
        else (k8s_packages | map('regex_replace', '^(.*)$', '\1=' ~ k8s_package_version) | list)
      }}
    state: present
    allow_change_held_packages: true
    update_cache: true
    lock_timeout: 120
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: not ansible_check_mode or (k8s_keyring_stat.stat.exists | default(false))

- name: Hold Kubernetes packages to prevent unintended automatic upgrades
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ k8s_packages }}"
  when: not ansible_check_mode or (k8s_keyring_stat.stat.exists | default(false))
