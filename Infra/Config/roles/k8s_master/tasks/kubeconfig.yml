---
# ==============================================================================
# K8S_MASTER TASKS: KUBECONFIG DISTRIBUTION & TAINTS
# ==============================================================================

- name: Ensure /root/.kube directory exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy admin.conf to /root/.kube/config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode or k8s_admin_conf.stat.exists

- name: Ensure ~/.kube directory exists for configured administrative users
  ansible.builtin.file:
    path: "/home/{{ item }}/.kube"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ k8s_kubeconfig_users }}"

- name: Copy admin.conf to ~/.kube/config for configured administrative users
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ item }}/.kube/config"
    remote_src: true
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0600"
  loop: "{{ k8s_kubeconfig_users }}"
  when: not ansible_check_mode or k8s_admin_conf.stat.exists

- name: Remove control-plane NoSchedule taint when workloads are allowed on master
  ansible.builtin.command:
    cmd: "kubectl taint nodes {{ hostname_short | lower }} node-role.kubernetes.io/control-plane:NoSchedule-"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: taint_removal
  failed_when:
    - taint_removal.rc != 0
    - "'not found' not in taint_removal.stderr"
  changed_when: taint_removal.rc == 0
  when:
    - k8s_allow_workloads_on_master | bool
    - not ansible_check_mode or k8s_admin_conf.stat.exists

- name: Ensure control-plane NoSchedule taint is present when workloads are disallowed on master
  ansible.builtin.command:
    cmd: "kubectl taint nodes {{ hostname_short | lower }} node-role.kubernetes.io/control-plane:NoSchedule --overwrite"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: taint_apply
  changed_when: "'tainted' in taint_apply.stdout and 'not tainted' not in taint_apply.stdout"
  when:
    - not (k8s_allow_workloads_on_master | bool)
    - not ansible_check_mode or k8s_admin_conf.stat.exists
