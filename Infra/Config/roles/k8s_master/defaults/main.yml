---
# ==============================================================================
# ROLE DEFAULTS: k8s_master
# ==============================================================================

k8s_version_minor: "1.31"
k8s_cluster_name: "essers-k8s"
k8s_apiserver_bind_port: 6443
k8s_control_plane_endpoint: "{{ ansible_host }}:{{ k8s_apiserver_bind_port }}"
k8s_pod_network_cidr: "10.244.0.0/16"
k8s_service_cidr: "10.96.0.0/12"
k8s_dns_domain: "cluster.local"
k8s_cri_socket: "unix:///run/containerd/containerd.sock"

# CNI Plugin Settings
k8s_cni_plugin: "calico" # Options: calico | flannel
k8s_calico_version: "v3.29.1"
k8s_calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ k8s_calico_version }}/manifests/calico.yaml"
k8s_flannel_manifest_url: "https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml"

# Scheduling & Tooling
k8s_allow_workloads_on_master: false
k8s_install_helm: true
k8s_kubeconfig_users:
  - "{{ ansible_user }}"
