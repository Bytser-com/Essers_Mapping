[defaults]
inventory               = ./inventories/testing/hosts.yml
roles_path              = ./roles
remote_user             = sysadmin
host_key_checking       = False
retry_files_enabled     = False
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = ./.cache/facts
fact_caching_timeout    = 3600
stdout_callback         = default
result_format           = yaml
callbacks_enabled       = profile_tasks, timer
forks                   = 10
timeout                 = 30
interpreter_python      = auto_silent

[privilege_escalation]
become                  = True
become_method           = sudo
become_user             = root
become_ask_pass         = False

[ssh_connection]
pipelining              = True
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
retries                 = 3
