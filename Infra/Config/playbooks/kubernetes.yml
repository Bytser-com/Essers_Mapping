---
# ==============================================================================
# PLAYBOOK: KUBERNETES CLUSTER CONFIGURATION
# Targets: k8s_cluster (k8s_masters & k8s_workers)
# ==============================================================================

- name: Prepare Kubernetes prerequisites and container runtime on all K8s nodes
  hosts: k8s_cluster
  become: true
  gather_facts: true
  tags:
    - k8s
    - containerd
    - runtime
    - swap
    - kernel
    - k8s_common
    - k8s_repo
    - k8s_install
    - k8s_configure
  roles:
    - role: containerd
      tags:
        - k8s
        - containerd
        - runtime
    - role: k8s_common
      tags:
        - k8s
        - k8s_common

- name: Initialize Kubernetes Control Plane and CNI
  hosts: k8s_masters
  become: true
  gather_facts: true
  tags:
    - k8s
    - k8s_master
    - control_plane
    - k8s_init
    - kubeconfig
    - cni
    - helm
    - join_token
    - k8s_worker
  roles:
    - role: k8s_master
      tags:
        - k8s
        - k8s_master
        - control_plane

- name: Join Kubernetes Worker Nodes to Cluster
  hosts: k8s_workers
  become: true
  gather_facts: true
  tags:
    - k8s
    - k8s_worker
    - workers
    - k8s_join
    - k8s_labels
  roles:
    - role: k8s_worker
      tags:
        - k8s
        - k8s_worker
        - workers
