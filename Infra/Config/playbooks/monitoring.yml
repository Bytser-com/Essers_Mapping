---
# ==============================================================================
# PLAYBOOK: END-TO-END MONITORING & TELEMETRY DEPLOYMENT
# Stages:
#   1. Install Prometheus Node Exporter & Grafana Alloy on ALL VMs (Master, Worker, Runner)
#   2. Deploy Prometheus Operator, Grafana, and Dashboards on Kubernetes (k8s_masters)
# ==============================================================================

- name: Stage 1 - Install Prometheus Node Exporter & Grafana Alloy on all virtual machines
  hosts: all
  become: true
  gather_facts: false
  tags:
    - monitoring
    - node_monitoring
    - alloy
    - node_exporter
  pre_tasks:
    - name: Materialize PIPELINE_SSH_PRIVATE_KEY to .cache/id_pipeline if provided via environment
      ansible.builtin.copy:
        content: "{{ lookup('env', 'PIPELINE_SSH_PRIVATE_KEY') | regex_replace('\\r', '') }}\n"
        dest: "{{ playbook_dir }}/../.cache/id_pipeline"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      when: lookup('env', 'PIPELINE_SSH_PRIVATE_KEY') | length > 0

    - name: Set ansible_ssh_private_key_file when PIPELINE_SSH_PRIVATE_KEY is used
      ansible.builtin.set_fact:
        ansible_ssh_private_key_file: "{{ playbook_dir }}/../.cache/id_pipeline"
      when: lookup('env', 'PIPELINE_SSH_PRIVATE_KEY') | length > 0

    - name: Gather host system facts
      ansible.builtin.setup:

  roles:
    - role: node_monitoring
      tags:
        - monitoring
        - node_monitoring
        - alloy
        - node_exporter

- name: Stage 2 - Deploy Prometheus Operator & Grafana Monitoring Stack on Kubernetes
  hosts: k8s_masters
  become: true
  gather_facts: false
  run_once: true
  tags:
    - monitoring
    - grafana
    - prometheus
    - addons
  vars:
    monitoring_namespace: "monitoring"
    monitoring_src_dir: "{{ playbook_dir }}/../../../Kubernetes/cluster-addons/monitoring"
    monitoring_dest_dir: "/etc/kubernetes/addons/monitoring"
    monitoring_env: "{{ env_name | default('testing') }}"
    monitoring_helm_release: "kube-prometheus-stack"
    monitoring_helm_chart: "prometheus-community/kube-prometheus-stack"
    monitoring_helm_repo_url: "https://prometheus-community.github.io/helm-charts"
    grafana_admin_user: "admin"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    - name: Verify control plane has admin.conf and cluster is responsive
      ansible.builtin.command:
        cmd: kubectl get nodes
      changed_when: false

    - name: Ensure target directory exists for monitoring manifests on master
      ansible.builtin.file:
        path: "{{ monitoring_dest_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Synchronize monitoring addon manifests to control plane node
      ansible.builtin.copy:
        src: "{{ monitoring_src_dir }}/"
        dest: "{{ monitoring_dest_dir }}/"
        owner: root
        group: root
        mode: "0644"

    - name: Ensure monitoring namespace exists
      ansible.builtin.command:
        cmd: "kubectl create namespace {{ monitoring_namespace }} --dry-run=client -o yaml"
      register: mon_ns_yaml
      changed_when: false

    - name: Apply monitoring namespace
      ansible.builtin.command:
        cmd: "kubectl apply -f -"
      args:
        stdin: "{{ mon_ns_yaml.stdout }}"
      changed_when: false

    - name: Ensure Grafana admin credentials secret exists
      ansible.builtin.command: >-
        kubectl create secret generic grafana-admin-credentials
        --namespace {{ monitoring_namespace }}
        --from-literal=admin-user={{ grafana_admin_user }}
        --from-literal=admin-password={{ grafana_admin_password }}
        --dry-run=client -o yaml
      register: grafana_secret_yaml
      changed_when: false

    - name: Apply Grafana admin credentials secret
      ansible.builtin.command:
        cmd: "kubectl apply -f -"
      args:
        stdin: "{{ grafana_secret_yaml.stdout }}"
      changed_when: false

    - name: Configure Discord notification webhook in monitoring values if provided
      ansible.builtin.replace:
        path: "{{ monitoring_dest_dir }}/values-{{ monitoring_env }}.yaml"
        regexp: 'https://discord\.com/api/webhooks/PLACEHOLDER_DISCORD_WEBHOOK_URL'
        replace: "{{ lookup('env', 'DISCORD_WEBHOOK_URL') }}"
      when: lookup('env', 'DISCORD_WEBHOOK_URL') | length > 0

    - name: Add prometheus-community Helm repository
      ansible.builtin.command:
        cmd: "helm repo add prometheus-community {{ monitoring_helm_repo_url }} --force-update"
      changed_when: false

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: "helm repo update"
      changed_when: false

    - name: Deploy or upgrade kube-prometheus-stack Helm chart ({{ monitoring_env }})
      ansible.builtin.command: >-
        helm upgrade --install {{ monitoring_helm_release }} {{ monitoring_helm_chart }}
        --namespace {{ monitoring_namespace }}
        --create-namespace
        -f {{ monitoring_dest_dir }}/values-{{ monitoring_env }}.yaml
        --wait
        --timeout 10m
      register: helm_monitoring_deploy
      changed_when: "'STATUS: deployed' in helm_monitoring_deploy.stdout"

    - name: Apply Calico Zero-Trust NetworkPolicies for monitoring namespace
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ monitoring_dest_dir }}/network-policies.yaml"
      changed_when: false

    - name: Apply ServiceMonitors for automated workload metric discovery
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ monitoring_dest_dir }}/service-monitors/"
      changed_when: false

    - name: Deploy Prometheus alerting rules
      ansible.builtin.command:
        cmd: "kubectl apply -k {{ monitoring_dest_dir }}/alerts/"
      changed_when: false

    - name: Deploy Grafana Loki log aggregation engine
      ansible.builtin.command:
        cmd: "kubectl apply -k {{ monitoring_dest_dir }}/loki/"
      changed_when: false

    - name: Deploy Grafana Alloy Kubernetes container log collector DaemonSet
      ansible.builtin.command:
        cmd: "kubectl apply -k {{ monitoring_dest_dir }}/alloy/"
      changed_when: false

    - name: Deploy Grafana Loki datasource
      ansible.builtin.command:
        cmd: "kubectl apply -k {{ monitoring_dest_dir }}/datasources/"
      changed_when: false

    - name: Deploy GitOps Grafana Dashboards as ConfigMaps
      ansible.builtin.command:
        cmd: "kubectl apply -k {{ monitoring_dest_dir }}/dashboards/"
      changed_when: false

    - name: Verify Grafana rollout status
      ansible.builtin.command: >-
        kubectl rollout status deployment/{{ monitoring_helm_release }}-grafana
        --namespace {{ monitoring_namespace }}
        --timeout=180s
      changed_when: false

    - name: Verify Grafana Loki rollout status
      ansible.builtin.command: >-
        kubectl rollout status statefulset/loki
        --namespace {{ monitoring_namespace }}
        --timeout=180s
      changed_when: false

    - name: Verify Grafana Alloy DaemonSet rollout status
      ansible.builtin.command: >-
        kubectl rollout status daemonset/alloy-k8s
        --namespace {{ monitoring_namespace }}
        --timeout=180s
      changed_when: false
