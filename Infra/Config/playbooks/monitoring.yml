---
# ==============================================================================
# PLAYBOOK: VIRTUAL MACHINE HOST TELEMETRY & MONITORING
# Installs Prometheus Node Exporter & Grafana Alloy on ALL VMs (Master, Worker, Runner)
# ==============================================================================

- name: Install Prometheus Node Exporter & Grafana Alloy on all virtual machines
  hosts: all
  become: true
  gather_facts: false
  tags:
    - monitoring
    - node_monitoring
    - alloy
    - node_exporter
  pre_tasks:
    - name: Materialize PIPELINE_SSH_PRIVATE_KEY to .cache/id_pipeline if provided via environment
      ansible.builtin.copy:
        content: "{{ lookup('env', 'PIPELINE_SSH_PRIVATE_KEY') | regex_replace('\\r', '') }}\n"
        dest: "{{ playbook_dir }}/../.cache/id_pipeline"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      when: lookup('env', 'PIPELINE_SSH_PRIVATE_KEY') | length > 0

    - name: Set ansible_ssh_private_key_file when PIPELINE_SSH_PRIVATE_KEY is used
      ansible.builtin.set_fact:
        ansible_ssh_private_key_file: "{{ playbook_dir }}/../.cache/id_pipeline"
      when: lookup('env', 'PIPELINE_SSH_PRIVATE_KEY') | length > 0

    - name: Gather host system facts
      ansible.builtin.setup:

  roles:
    - role: node_monitoring
      tags:
        - monitoring
        - node_monitoring
        - alloy
        - node_exporter
