---
# ==============================================================================
# ANSIBLE INVENTORY - TESTING ENVIRONMENT
# Mirrors Proxmox VMs provisioned by Infra/Setup (Debian 13 Trixie Cloud-Init)
# ==============================================================================

all:
  children:
    k8s_cluster:
      children:
        k8s_masters:
          hosts:
            k8s-masterServer:
              ansible_host: "{{ lookup('env', 'K8S_MASTER_VM_IPV4_ADDRESS') | default(undef('K8S_MASTER_VM_IPV4_ADDRESS is required in .env'), true) | ansible.utils.ipaddr('address') }}"

        k8s_workers:
          hosts:
            k8s-workerServer:
              ansible_host: "{{ lookup('env', 'K8S_WORKER_VM_IPV4_ADDRESS') | default(undef('K8S_WORKER_VM_IPV4_ADDRESS is required in .env'), true) | ansible.utils.ipaddr('address') }}"

    runners:
      hosts:
        pipeline-runner:
          ansible_host: "{{ lookup('env', 'PIPELINE_RUNNER_VM_IPV4_ADDRESS') | default(undef('PIPELINE_RUNNER_VM_IPV4_ADDRESS is required in .env'), true) | ansible.utils.ipaddr('address') }}"