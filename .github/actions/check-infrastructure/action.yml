name: Check infrastructure
description: Verify Terraform-defined Proxmox VMs are running without creating or changing infrastructure.

inputs:
  api-url:
    description: Proxmox API URL
    required: true
  api-token:
    description: Proxmox API token
    required: true
  node-name:
    description: Proxmox node containing the VMs
    required: true
  insecure:
    description: Allow self-signed TLS, matching Terraform's proxmox_api_insecure setting
    default: 'true'
  tfvars:
    description: Repository-relative file containing the three VM IDs
    default: Infra/Setup/terraform.tfvars

runs:
  using: composite
  steps:
    - name: Validate infrastructure check
      shell: bash
      run: python3 -m unittest discover -s "$GITHUB_WORKSPACE/Scripts/tests" -p 'test_*.py'

    - name: Verify Proxmox VMs
      shell: bash
      env:
        # --- Secrets ---
        PROXMOX_API_TOKEN: ${{ inputs.api-token }}
        # --- Variables ---
        PROXMOX_API_URL: ${{ inputs.api-url }}
        NODE01_NAME: ${{ inputs.node-name }}
        PROXMOX_INSECURE: ${{ inputs.insecure }}
        TFVARS_PATH: ${{ inputs.tfvars }}
      run: |
        set -euo pipefail
        args=(--tfvars "$GITHUB_WORKSPACE/$TFVARS_PATH")
        if [[ "$PROXMOX_INSECURE" == "true" ]]; then
          args+=(--insecure)
        fi
        python3 "$GITHUB_WORKSPACE/Scripts/check-proxmox-vms.py" "${args[@]}"
