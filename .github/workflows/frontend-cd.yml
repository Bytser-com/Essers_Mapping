name: Frontend CD

# Automatic delivery is called once by the CI workflow; this file is manual recovery.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: frontend-cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  delivery:
    uses: ./.github/workflows/service-cd.yml
    with:
      service-path: Frontend
      image-name: frontend
      deployment: frontend
      ci-workflow: frontend-ci.yml
    secrets: inherit
