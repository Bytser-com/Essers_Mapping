name: Mapping Converter CD

# Automatic delivery is called once by the CI workflow; this file is manual recovery.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: mapping-converter-cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  delivery:
    uses: ./.github/workflows/service-cd.yml
    with:
      service-path: Mapping_Converter
      image-name: mapping-converter
      deployment: mapping-converter
      ci-workflow: mapping-converter-ci.yml
    secrets: inherit
