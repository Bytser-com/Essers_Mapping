name: Service CD (reusable)

on:
  workflow_call:
    inputs:
      service-path:
        type: string
        required: true
      image-name:
        type: string
        required: true
      deployment:
        type: string
        required: true
      ci-workflow:
        type: string
        required: true

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  select:
    name: Select trusted CI image or tested release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      enabled: ${{ steps.ci.outputs.enabled }}
      sha: ${{ steps.ci.outputs.sha }}
      branch: ${{ steps.ci.outputs.branch }}
      run-id: ${{ steps.ci.outputs.run-id }}
      image: ${{ steps.ci.outputs.image }}
      environment: ${{ steps.ci.outputs.environment }}
      namespace: ${{ steps.ci.outputs.namespace }}
      source-tree: ${{ steps.ci.outputs.source-tree }}
      release-name: ${{ steps.ci.outputs.release-name }}
      image-artifact-id: ${{ steps.ci.outputs.image-artifact-id }}
      receipt-id: ${{ steps.ci.outputs.receipt-id }}
      receipt-run-id: ${{ steps.ci.outputs.receipt-run-id }}
      receipt-sha: ${{ steps.ci.outputs.receipt-sha }}
    steps:
      - name: Checkout release helpers from this trusted branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select the image without rebuilding
        id: ci
        uses: actions/github-script@v8
        env:
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          SERVICE_PATH: ${{ inputs.service-path }}
          IMAGE_NAME: ${{ inputs.image-name }}
        with:
          script: |
            const selectRelease = require('./Scripts/select-service-release.cjs');
            await selectRelease({ github, context, core, env: process.env });

  publish:
    name: Publish CI image or reuse Testing digest
    needs: select
    if: needs.select.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image || steps.promote.outputs.image }}
      source-sha: ${{ steps.publish.outputs.source-sha || steps.promote.outputs.source-sha }}
    env:
      SERVICE_PATH: ${{ inputs.service-path }}
      SOURCE_SHA: ${{ needs.select.outputs.sha }}
      SOURCE_TREE: ${{ needs.select.outputs.source-tree }}
      IMAGE_BASE: ${{ needs.select.outputs.image }}
    steps:
      - name: Checkout the validated revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false

      - name: Download the container built and tested by Testing CI
        if: needs.select.outputs.branch == 'Testing'
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ needs.select.outputs.image-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/service-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.select.outputs.run-id }}

      - name: Login to GHCR
        if: needs.select.outputs.branch == 'Testing'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the existing CI image and record its digest
        id: publish
        if: needs.select.outputs.branch == 'Testing'
        run: bash Scripts/publish-service-image.sh

      - name: Download the matching successful Testing release
        if: needs.select.outputs.branch == 'main'
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ needs.select.outputs.receipt-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/tested-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.select.outputs.receipt-run-id }}

      - name: Reuse the exact image digest tested on Testing
        id: promote
        if: needs.select.outputs.branch == 'main'
        env:
          IMAGE_SOURCE_SHA: ${{ needs.select.outputs.receipt-sha }}
        run: python3 Scripts/service-release.py read "$RUNNER_TEMP/tested-release/release.json"

  deploy:
    name: Deploy service image
    needs: [select, publish]
    runs-on:
      - self-hosted
      - linux
      - ${{ needs.select.outputs.branch == 'main' && 'production' || 'testing' }}
    environment: ${{ needs.select.outputs.environment }}
    concurrency:
      group: cluster-write-${{ needs.select.outputs.branch == 'main' && 'production' || 'testing' }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      # --- Secrets ---
      KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
      SSH_PRIVATE_KEY: ${{ secrets.PIPELINE_SSH_PRIVATE_KEY }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      # --- Variables ---
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
      DEBIAN_VM_USERNAME: ${{ vars.DEBIAN_VM_USERNAME || 'sysadmin' }}
      K8S_MASTER_VM_IPV4_ADDRESS: ${{ vars.K8S_MASTER_VM_IPV4_ADDRESS }}
      NAMESPACE: ${{ needs.select.outputs.namespace }}
      DEPLOYMENT: ${{ inputs.deployment }}
      IMAGE: ${{ needs.publish.outputs.image }}
      SERVICE_PATH: ${{ inputs.service-path }}
      SOURCE_TREE: ${{ needs.select.outputs.source-tree }}
      IMAGE_BASE: ${{ needs.select.outputs.image }}
      IMAGE_SOURCE_SHA: ${{ needs.publish.outputs.source-sha }}
      CI_RUN_ID: ${{ needs.select.outputs.run-id }}
      SOURCE_SHA: ${{ needs.select.outputs.sha }}
      SOURCE_BRANCH: ${{ needs.select.outputs.branch }}
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false

      - name: Verify infrastructure is deployed
        uses: ./.github/actions/check-infrastructure
        with:
          api-url: ${{ vars.PROXMOX_API_URL }}
          api-token: ${{ secrets.PROXMOX_API_TOKEN }}
          node-name: ${{ vars.NODE01_NAME }}

      - name: Refuse stale deployments after waiting for the environment
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${process.env.SOURCE_BRANCH}` });
            if (data.object.sha !== process.env.SOURCE_SHA) throw new Error('A newer commit exists; refusing to deploy this stale image.');

      - name: Prepare isolated Kubernetes connection
        run: |
          set -euo pipefail
          GHCR_USERNAME="${GHCR_USERNAME:-${{ github.actor }}}"
          GHCR_TOKEN="${GHCR_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
          export GHCR_USERNAME GHCR_TOKEN
          install -d -m 700 "$RUNNER_TEMP/k8s"
          kubeconfig_path="$RUNNER_TEMP/k8s/config"
          master_ip="${K8S_MASTER_VM_IPV4_ADDRESS%%/*}"
          if [[ -n "$KUBECONFIG_SECRET" ]]; then
            if [[ "$KUBECONFIG_SECRET" == *apiVersion:* ]]; then
              printf '%s\n' "$KUBECONFIG_SECRET" > "$kubeconfig_path"
            else
              printf '%s' "$KUBECONFIG_SECRET" | base64 -d > "$kubeconfig_path"
            fi
          elif [[ -s "$HOME/.kube/config" ]]; then
            cp "$HOME/.kube/config" "$kubeconfig_path"
          else
            : "${SSH_PRIVATE_KEY:?No kubeconfig or PIPELINE_SSH_PRIVATE_KEY is available}"
            : "${master_ip:?K8S_MASTER_VM_IPV4_ADDRESS is missing}"
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/k8s/id_pipeline"
            chmod 600 "$RUNNER_TEMP/k8s/id_pipeline"
            ssh -i "$RUNNER_TEMP/k8s/id_pipeline" \
              -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/k8s/known_hosts" \
              -o ConnectTimeout=15 "${DEBIAN_VM_USERNAME}@${master_ip}" 'sudo cat /etc/kubernetes/admin.conf' \
              | sed -E "s|server:[[:space:]]*https://[^[:space:]]+|server: https://${master_ip}:6443|g" > "$kubeconfig_path"
          fi
          chmod 600 "$kubeconfig_path"
          echo "KUBECONFIG=$kubeconfig_path" >> "$GITHUB_ENV"

      - name: Configure Mapping Proposal Gemini credentials
        if: inputs.service-path == 'Mapping_Proposal'
        env:
          # --- Secrets ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          : "${GEMINI_API_KEY:?Set GEMINI_API_KEY as a GitHub repository or environment secret}"
          kubectl create secret generic gemini-api \
            --namespace "$NAMESPACE" \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy only the selected service and wait for rollout
        run: |
          set -euo pipefail
          kubectl get deployment "$DEPLOYMENT" -n "$NAMESPACE" >/dev/null
          # Durable credentials allow later restarts/scaling after GITHUB_TOKEN expires.
          python3 Scripts/registry-pull-secret.py | kubectl apply -f -
          # Apply image and key-refresh annotation together, producing one rollout.
          patch=$(python3 -c '
          import json
          import os

          template = {"spec": {"containers": [{"name": os.environ["DEPLOYMENT"], "image": os.environ["IMAGE"]}]}}
          if os.environ["DEPLOYMENT"] == "mapping-proposal":
              template["metadata"] = {"annotations": {
                  "essers.io/gemini-deploy-run": os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"],
              }}
          print(json.dumps({
              "metadata": {"annotations": {
                  "essers.io/image-managed-by": "service-cd",
                  "essers.io/source-sha": os.environ["SOURCE_SHA"],
                  "essers.io/image-source-sha": os.environ["IMAGE_SOURCE_SHA"],
              }},
              "spec": {"template": template},
          }))
          ')
          # Strip any leftover dummy placeholder command/args on the live deployment
          cleanup_patch=$(kubectl get deployment "$DEPLOYMENT" -n "$NAMESPACE" -o json | python3 Scripts/cleanup-deployment-overrides.py "$DEPLOYMENT")
          if [[ "$cleanup_patch" != "[]" ]]; then
            kubectl patch deployment "$DEPLOYMENT" -n "$NAMESPACE" --type=json -p "$cleanup_patch"
          fi
          kubectl patch deployment "$DEPLOYMENT" -n "$NAMESPACE" --type=strategic --patch "$patch"
          if ! kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=300s; then
            echo "::error::Rollout failed or timed out for deployment/$DEPLOYMENT in $NAMESPACE. Capturing diagnostics..."
            kubectl describe deployment "$DEPLOYMENT" -n "$NAMESPACE" || true
            kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name="$DEPLOYMENT" -o wide || true
            kubectl describe pods -n "$NAMESPACE" -l app.kubernetes.io/name="$DEPLOYMENT" || true
            kubectl logs -n "$NAMESPACE" deployment/"$DEPLOYMENT" --tail=100 --all-containers=true || true
            echo "Triggering automatic rollback..."
            kubectl rollout undo "deployment/$DEPLOYMENT" -n "$NAMESPACE"
            kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=180s || true
            echo "⚠️ Rollout failed: $DEPLOYMENT was automatically rolled back to the previous stable revision." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Deployed $DEPLOYMENT at $IMAGE in $NAMESPACE." >> "$GITHUB_STEP_SUMMARY"

      - name: Record the successfully deployed Testing image
        if: needs.select.outputs.branch == 'Testing'
        run: python3 Scripts/service-release.py write "$RUNNER_TEMP/tested-release/release.json"

      - name: Save Testing release for later production promotion
        if: needs.select.outputs.branch == 'Testing'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.select.outputs.release-name }}
          path: ${{ runner.temp }}/tested-release/release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Clean temporary connection material
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/k8s" ]]; then
            find "$RUNNER_TEMP/k8s" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/k8s"
          fi
