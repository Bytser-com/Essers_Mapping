name: Mapping Proposal CI

on:
  pull_request:
    branches: [main, Testing, Development]
  push:
    branches: [main, Testing, Development]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: mapping-proposal-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Mapping Proposal changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect service changes
        id: changes
        uses: ./.github/actions/service-changes
        with:
          service-path: Mapping_Proposal
          workflow-path: .github/workflows/mapping-proposal-ci.yml
          shared-paths: |
            Scripts/detect-service-changes.py
            .github/actions/dependency-audit
            Scripts/dependency-inventory.py
            .github/workflows/python-service-ci.yml
            .github/actions/setup-python-service
            Scripts/python-service-readiness.py
            .github/requirements/python-ci.txt
            .github/workflows/mapping-proposal-cd.yml
            .github/workflows/service-cd.yml
            Scripts/smoke-service-image.sh
            Scripts/registry-pull-secret.py

  checks:
    name: Mapping Proposal checks
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service-path: Mapping_Proposal
      artifact-prefix: mapping-proposal

  quality-gate:
    name: Mapping Proposal CI Gate
    needs: [changes, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful change detection
        env:
          RESULT: ${{ needs.changes.result }}
        run: test "$RESULT" = success

      - name: Require successful checks when the service changed
        if: needs.changes.outputs.changed != 'false'
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success

  delivery:
    name: Mapping Proposal CD
    needs: [changes, checks, quality-gate]
    if: github.event_name == 'push' && (github.ref_name == 'Testing' || github.ref_name == 'main') && needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/service-cd.yml
    with:
      service-path: Mapping_Proposal
      image-name: mapping-proposal
      deployment: mapping-proposal
      ci-workflow: mapping-proposal-ci.yml
      artifact-name: mapping-proposal-test-reports
      artifact-path: ''
    secrets: inherit
