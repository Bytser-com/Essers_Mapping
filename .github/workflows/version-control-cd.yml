name: Version Control CD

# Automatic delivery is called once by the CI workflow; this file is manual recovery.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: version-control-cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  delivery:
    uses: ./.github/workflows/service-cd.yml
    with:
      service-path: Version_Control
      image-name: version-control-backend
      deployment: version-control-backend
      ci-workflow: version-control-ci.yml
    secrets: inherit
