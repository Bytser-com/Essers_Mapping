name: CI - Full Stack Tests, E2E & SonarQube Coverage

# ==============================================================================
# Enterprise Continuous Integration & Quality Gate Pipeline
# Triggers on every Pull Request and Push to:
#   - main
#   - testing / Testing
#   - development / Development
#
# Industry Best Practices Enforced:
#   - Strict job timeouts (timeout-minutes) to prevent hung runners
#   - Least-privilege GITHUB_TOKEN permissions
#   - Deterministic dependency caching (npm, maven, pip, playwright)
#   - Multi-tier test pyramid: Static Analysis/Lint -> Unit -> Functional -> Integration -> E2E
#   - Unified Code Coverage (V8 LCOV, JaCoCo XML, Pytest Cobertura XML) + SonarQube Quality Gate
#   - Executive CI & Coverage Report in GitHub Step Summary + downloadable HTML report bundle
#   - Single Required Status Check ("CI Quality Gate") to block Pull Request merges on any failure
# ==============================================================================

on:
  pull_request:
    branches:
      - main
      - testing
      - Testing
      - development
      - Development

  push:
    branches:
      - main
      - testing
      - Testing
      - development
      - Development

  workflow_dispatch:

concurrency:
  group: ci-pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # JOB 1: DISCOVER ALL FRONTEND, JAVA SPRING BOOT 4 & PYTHON BACKEND SERVICES
  # ============================================================================
  discover:
    name: Discover Stack & Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_frontend: ${{ steps.scan.outputs.has_frontend }}
      java_matrix: ${{ steps.scan.outputs.java_matrix }}
      has_java: ${{ steps.scan.outputs.has_java }}
      python_matrix: ${{ steps.scan.outputs.python_matrix }}
      has_python: ${{ steps.scan.outputs.has_python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository for Frontend, Java Spring Boot & Python services
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          # 1. Frontend detection
          if [ -f "Frontend/package.json" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
            echo "Detected Frontend project: Frontend/package.json"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # 2. Java Spring Boot 4 Backends detection (all pom.xml files)
          JAVA_DIRS=$(find . -maxdepth 4 -name "pom.xml" -not -path "*/.*" -printf "%h\n" | sed 's|^\./||' | sort -u)
          if [ -n "$JAVA_DIRS" ]; then
            JAVA_JSON=$(printf '%s\n' "$JAVA_DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({name: (gsub("/"; "-")), path: .})')
            echo "has_java=true" >> "$GITHUB_OUTPUT"
            echo "java_matrix={\"include\":${JAVA_JSON}}" >> "$GITHUB_OUTPUT"
            echo "Detected Java Spring Boot backends: ${JAVA_JSON}"
          else
            echo "has_java=false" >> "$GITHUB_OUTPUT"
            echo 'java_matrix={"include":[{"name":"none","path":"none"}]}' >> "$GITHUB_OUTPUT"
          fi

          # 3. Python Backends detection (Mapping_Converter, Mapping_Proposal, ai_tool, or any dir with requirements.txt / pyproject.toml)
          PY_CANDIDATES=()
          for dir in Mapping_Converter Mapping_Proposal ai_tool; do
            if [ -d "$dir" ]; then
              PY_CANDIDATES+=("$dir")
            fi
          done

          while IFS= read -r req_dir; do
            [ -z "$req_dir" ] && continue
            ALREADY=false
            for existing in "${PY_CANDIDATES[@]:-}"; do
              if [[ "$req_dir" == "$existing" || "$req_dir" == "$existing/"* ]]; then
                ALREADY=true
                break
              fi
            done
            if [ "$ALREADY" = "false" ]; then
              PY_CANDIDATES+=("$req_dir")
            fi
          done < <(find . -maxdepth 3 \( -name "requirements.txt" -o -name "pyproject.toml" \) -not -path "*/.*" -not -path "./Infra/*" -not -path "./Frontend/*" -not -path "./Runtime/*" -printf "%h\n" | sed 's|^\./||' | sort -u)

          if [ "${#PY_CANDIDATES[@]}" -gt 0 ]; then
            PY_JSON=$(printf '%s\n' "${PY_CANDIDATES[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({name: (gsub("/"; "-")), path: .})')
            echo "has_python=true" >> "$GITHUB_OUTPUT"
            echo "python_matrix={\"include\":${PY_JSON}}" >> "$GITHUB_OUTPUT"
            echo "Detected Python backend directories: ${PY_JSON}"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
            echo 'python_matrix={"include":[{"name":"none","path":"none"}]}' >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # JOB 2: FRONTEND (REACT 19) - LINT, UNIT, FUNCTIONAL, INTEGRATION & COVERAGE
  # ============================================================================
  frontend-tests:
    name: Frontend (React 19) - Lint, Unit, Functional & Integration
    needs: discover
    if: needs.discover.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run ESLint Static Analysis
        id: lint
        shell: bash
        run: npm run lint

      - name: Run Unit Tests
        id: unit
        shell: bash
        run: npm run test:unit

      - name: Run Functional Tests
        id: functional
        shell: bash
        run: npm run test:functional

      - name: Run Integration Tests
        id: integration
        shell: bash
        run: npm run test:integration

      - name: Run Full Frontend Test Suite with V8 Code Coverage (LCOV & HTML)
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          npm run test:coverage
          if [ ! -f "coverage/lcov.info" ]; then
            echo "::error::Expected Frontend coverage report at Frontend/coverage/lcov.info was not generated"
            exit 1
          fi

      - name: Build Production React 19 Bundle
        id: build
        shell: bash
        run: npm run build

      - name: Upload Frontend Coverage & JUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: |
            sonar-project.properties
            Frontend/coverage/**
            Frontend/test-results/**
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Frontend Production Bundle (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/**
          retention-days: 7
          if-no-files-found: error

      - name: Generate Detailed Frontend Test & Coverage Report
        if: always()
        shell: bash
        run: |
          python3 - << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os, xml.etree.ElementTree as ET

          print("### ⚛️ Frontend (React 19) Test & Code Coverage Report\n")
          print("| Stage | Status |")
          print("| :--- | :--- |")
          stages = [
              ("ESLint Static Analysis", "${{ steps.lint.outcome }}"),
              ("Unit Tests (`src/__tests__/unit`)", "${{ steps.unit.outcome }}"),
              ("Functional Tests (`src/__tests__/functional`)", "${{ steps.functional.outcome }}"),
              ("Integration Tests (`src/__tests__/integration`)", "${{ steps.integration.outcome }}"),
              ("V8 Code Coverage (`lcov.info`)", "${{ steps.coverage.outcome }}"),
              ("Vite Production Bundle Build", "${{ steps.build.outcome }}"),
          ]
          for label, outcome in stages:
              icon = "✅ Passed" if outcome == "success" else ("⏭️ Skipped" if outcome == "skipped" else "❌ Failed")
              print(f"| **{label}** | {icon} |")

          if os.path.exists("coverage/coverage-summary.json"):
              with open("coverage/coverage-summary.json") as f:
                  cov = json.load(f).get("total", {})
              print("\n#### 📊 Frontend Code Coverage Breakdown")
              print("| Metric | Coverage % | Covered / Total |")
              print("| :--- | :---: | :---: |")
              for key, title in [("lines", "Lines"), ("statements", "Statements"), ("functions", "Functions"), ("branches", "Branches")]:
                  m = cov.get(key, {})
                  pct = m.get("pct", 0)
                  covered = m.get("covered", 0)
                  total = m.get("total", 0)
                  print(f"| **{title}** | **{pct}%** | `{covered} / {total}` |")

          if os.path.exists("test-results/vitest-junit.xml"):
              tree = ET.parse("test-results/vitest-junit.xml")
              root = tree.getroot()
              suites = root.findall(".//testsuite") if root.tag == "testsuites" else [root]
              tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
              time_s = sum(float(s.attrib.get("time", 0.0)) for s in suites)
              passed = tests - failures - errors - skipped
              print(f"\n**Test Execution Summary:** `{passed}/{tests} passed` (`{failures + errors} failed`, `{skipped} skipped`) in `{time_s:.2f}s`")
          PYEOF

  # ============================================================================
  # JOB 3: JAVA SPRING BOOT 4 BACKENDS - UNIT, INTEGRATION, FUNCTIONAL & JACOCO
  # ============================================================================
  java-backends-tests:
    name: Java Spring Boot 4 (${{ matrix.name }}) - Unit, Integration, Functional & Coverage
    needs: discover
    if: needs.discover.outputs.has_java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.java_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Ensure Maven Wrapper is executable
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
          fi

      - name: Compile Source & Test Classes
        id: compile
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          MVN_CMD="./mvnw"
          [ ! -f "./mvnw" ] && MVN_CMD="mvn"
          $MVN_CMD -B clean test-compile

      - name: Run Unit Tests (Maven Surefire)
        id: unit
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          MVN_CMD="./mvnw"
          [ ! -f "./mvnw" ] && MVN_CMD="mvn"
          $MVN_CMD -B test

      - name: Run Integration & Functional Tests (Maven Failsafe) + JaCoCo Coverage Report
        id: verify
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          MVN_CMD="./mvnw"
          [ ! -f "./mvnw" ] && MVN_CMD="mvn"

          $MVN_CMD -B verify org.jacoco:jacoco-maven-plugin:0.8.12:report

          if [ ! -f "target/site/jacoco/jacoco.xml" ]; then
            echo "::error::Expected JaCoCo XML report at ${{ matrix.path }}/target/site/jacoco/jacoco.xml was not generated"
            exit 1
          fi

      - name: Upload Java Bytecode, JUnit & JaCoCo Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-artifacts-${{ matrix.name }}
          path: |
            sonar-project.properties
            ${{ matrix.path }}/target/classes/**
            ${{ matrix.path }}/target/test-classes/**
            ${{ matrix.path }}/target/site/jacoco/**
            ${{ matrix.path }}/target/surefire-reports/**
            ${{ matrix.path }}/target/failsafe-reports/**
            ${{ matrix.path }}/target/*.jar
          retention-days: 14
          if-no-files-found: warn

      - name: Generate Detailed Java Spring Boot 4 Test & JaCoCo Report (${{ matrix.name }})
        if: always()
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          python3 - << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET

          print("### ☕ Java Spring Boot 4 (`${{ matrix.path }}`) Test & JaCoCo Coverage Report\n")
          print("| Stage | Status |")
          print("| :--- | :--- |")
          for label, outcome in [
              ("Maven Compilation", "${{ steps.compile.outcome }}"),
              ("Unit Tests (Maven Surefire)", "${{ steps.unit.outcome }}"),
              ("Integration & Functional Tests (Maven Failsafe) + JaCoCo", "${{ steps.verify.outcome }}"),
          ]:
              icon = "✅ Passed" if outcome == "success" else ("⏭️ Skipped" if outcome == "skipped" else "❌ Failed")
              print(f"| **{label}** | {icon} |")

          if os.path.exists("target/site/jacoco/jacoco.xml"):
              root = ET.parse("target/site/jacoco/jacoco.xml").getroot()
              print("\n#### 📊 JaCoCo Code Coverage Breakdown")
              print("| Counter | Coverage % | Covered / Total |")
              print("| :--- | :---: | :---: |")
              for counter in root.findall("counter"):
                  ctype = counter.attrib.get("type", "").title()
                  missed = int(counter.attrib.get("missed", 0))
                  covered = int(counter.attrib.get("covered", 0))
                  total = missed + covered
                  pct = (covered / total * 100.0) if total > 0 else 100.0
                  print(f"| **{ctype}** | **{pct:.1f}%** | `{covered} / {total}` |")

          xml_files = glob.glob("target/surefire-reports/TEST-*.xml") + glob.glob("target/failsafe-reports/TEST-*.xml")
          if xml_files:
              tests = failures = errors = skipped = 0
              time_s = 0.0
              for xf in xml_files:
                  r = ET.parse(xf).getroot()
                  tests += int(r.attrib.get("tests", 0))
                  failures += int(r.attrib.get("failures", 0))
                  errors += int(r.attrib.get("errors", 0))
                  skipped += int(r.attrib.get("skipped", 0))
                  time_s += float(r.attrib.get("time", 0.0))
              passed = tests - failures - errors - skipped
              print(f"\n**JUnit Execution Summary:** `{passed}/{tests} passed` (`{failures + errors} failed`, `{skipped} skipped`) in `{time_s:.2f}s`")
          PYEOF

  # ============================================================================
  # JOB 4: PYTHON BACKENDS - LINT, UNIT, FUNCTIONAL, INTEGRATION & COVERAGE
  # ============================================================================
  python-backends-tests:
    name: Python Backend (${{ matrix.name }}) - Lint, Unit, Functional, Integration & Coverage
    needs: discover
    if: needs.discover.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.python_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check Python source files in ${{ matrix.path }}
        id: check_py
        shell: bash
        run: |
          set -euo pipefail
          PY_COUNT=$(find "${{ matrix.path }}" -name "*.py" -not -path "*/.*" | wc -l)
          if [ "$PY_COUNT" -gt 0 ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "Found ${PY_COUNT} Python file(s) in ${{ matrix.path }}"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Directory ${{ matrix.path }} currently contains no .py files (scaffold only). Skipping pytest until Python code is added."
          fi

      - name: Install Python dependencies & test/coverage tooling
        if: steps.check_py.outputs.has_code == 'true'
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-asyncio httpx ruff flake8
          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f "requirements-dev.txt" ]; then
            python -m pip install -r requirements-dev.txt
          fi
          if [ -f "pyproject.toml" ]; then
            python -m pip install -e . || true
          fi

      - name: Run Python Syntax & Static Analysis (compileall + ruff)
        id: lint
        if: steps.check_py.outputs.has_code == 'true'
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          ruff check --select=E9,F63,F7,F82 .

      - name: Run Python Unit, Functional & Integration Tests with Coverage
        id: pytest
        if: steps.check_py.outputs.has_code == 'true'
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results

          TEST_FILES=$(find . \( -name "test_*.py" -o -name "*_test.py" -o -path "*/tests/*.py" \) -not -path "*/.*")
          if [ -z "$TEST_FILES" ]; then
            echo "::error::Python backend '${{ matrix.path }}' contains Python source code but no test files (test_*.py or *_test.py)!"
            exit 1
          fi

          python -m pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results/pytest-junit.xml

          if [ ! -f "coverage.xml" ]; then
            echo "::error::Expected Python coverage report at ${{ matrix.path }}/coverage.xml was not generated"
            exit 1
          fi

      - name: Upload Python Coverage & JUnit Reports
        if: always() && steps.check_py.outputs.has_code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts-${{ matrix.name }}
          path: |
            sonar-project.properties
            ${{ matrix.path }}/coverage.xml
            ${{ matrix.path }}/test-results/**
          retention-days: 14
          if-no-files-found: warn

      - name: Generate Detailed Python Backend Report (${{ matrix.name }})
        if: always()
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          python3 - << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET

          print("### 🐍 Python Backend (`${{ matrix.path }}`) Test & Coverage Report\n")
          if "${{ steps.check_py.outputs.has_code }}" != "true":
              print("> ℹ️ Directory `${{ matrix.path }}` is currently a scaffold placeholder (no `.py` files on this branch yet). Full `ruff` + `pytest --cov` checks will activate automatically once `.py` files are added.")
          else:
              print("| Stage | Status |")
              print("| :--- | :--- |")
              for label, outcome in [
                  ("Syntax & Static Analysis (`compileall` + `ruff`)", "${{ steps.lint.outcome }}"),
                  ("Unit, Functional & Integration Tests (`pytest --cov`)", "${{ steps.pytest.outcome }}"),
              ]:
                  icon = "✅ Passed" if outcome == "success" else ("⏭️ Skipped" if outcome == "skipped" else "❌ Failed")
                  print(f"| **{label}** | {icon} |")

              if os.path.exists("coverage.xml"):
                  root = ET.parse("coverage.xml").getroot()
                  line_rate = float(root.attrib.get("line-rate", 0.0)) * 100.0
                  branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100.0
                  lines_valid = root.attrib.get("lines-valid", "0")
                  lines_covered = root.attrib.get("lines-covered", "0")
                  print(f"\n**Python Code Coverage:** **{line_rate:.1f}% Line Coverage** (`{lines_covered}/{lines_valid}` lines), **{branch_rate:.1f}% Branch Coverage**")
          PYEOF

  # ============================================================================
  # JOB 5: END-TO-END (E2E) TESTS (REACT 19 + NGINX CONTAINER + PLAYWRIGHT)
  # ============================================================================
  e2e-tests:
    name: End-to-End (E2E) - React 19, Nginx & Playwright Browser Suite
    needs: [discover, frontend-tests, java-backends-tests, python-backends-tests]
    if: >-
      !cancelled() &&
      needs.frontend-tests.result == 'success' &&
      (needs.java-backends-tests.result == 'success' || needs.java-backends-tests.result == 'skipped') &&
      (needs.python-backends-tests.result == 'success' || needs.python-backends-tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Download compiled Frontend bundle (dist)
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Install Frontend dependencies & Playwright Chromium browser
        working-directory: Frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start & Verify Nginx + React 19 Production Container and Run Playwright E2E Suite
        id: e2e
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_NAME="essers-frontend-e2e-${GITHUB_RUN_ID}"

          cleanup() {
            echo "Stopping E2E Nginx container ${CONTAINER_NAME}..."
            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if [ -f "Frontend/Dockerfile" ]; then
            echo "Building production image from Frontend/Dockerfile..."
            docker build -t essers-frontend-e2e:test Frontend
            docker run -d \
              --name "${CONTAINER_NAME}" \
              -p 8080:8080 \
              -e PROPOSAL_API_URL="http://127.0.0.1:8000" \
              essers-frontend-e2e:test
          else
            echo "Starting nginx:1.27-alpine serving Frontend/dist on port 8080..."
            NGINX_CONF_DIR="$RUNNER_TEMP/nginx-e2e"
            mkdir -p "$NGINX_CONF_DIR"
            cat << 'EOF' > "$NGINX_CONF_DIR/default.conf"
          server {
              listen 8080;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;
              server_tokens off;

              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;

              location = /healthz {
                  access_log off;
                  default_type text/plain;
                  return 200 "OK\n";
              }

              location ~ /\. {
                  deny all;
                  access_log off;
                  log_not_found off;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          EOF
            docker run -d \
              --name "${CONTAINER_NAME}" \
              -p 8080:8080 \
              -v "$PWD/Frontend/dist:/usr/share/nginx/html:ro" \
              -v "$NGINX_CONF_DIR/default.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine
          fi

          echo "1. Waiting for Nginx /healthz endpoint on http://127.0.0.1:8080/healthz..."
          READY=false
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q "OK"; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "::error::Nginx container failed /healthz check"
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "2. Verifying Nginx configuration syntax, security headers & hidden file blocking..."
          docker exec "${CONTAINER_NAME}" nginx -t
          HEADERS=$(curl -sSI http://127.0.0.1:8080/)
          echo "$HEADERS" | grep -qi "X-Frame-Options: SAMEORIGIN"
          echo "$HEADERS" | grep -qi "X-Content-Type-Options: nosniff"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/.env)
          if [ "$HTTP_CODE" != "403" ] && [ "$HTTP_CODE" != "404" ]; then
            echo "::error::Expected /.env to be blocked (403/404), got HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "3. Running Playwright End-to-End (E2E) Browser Tests against Nginx (http://127.0.0.1:8080)..."
          cd Frontend
          PLAYWRIGHT_BASE_URL="http://127.0.0.1:8080" PLAYWRIGHT_SKIP_WEBSERVER=1 npx playwright test

      - name: Upload Playwright E2E Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            sonar-project.properties
            Frontend/playwright-report/**
            Frontend/test-results/playwright-junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: E2E Test Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 🌐 End-to-End (E2E) & Container Verification Summary"
            echo ""
            echo "| Check | Status |"
            echo "| :--- | :--- |"
            echo "| **Nginx + React 19 Container Health (`/healthz`), Config (`nginx -t`) & Security Headers** | ${{ steps.e2e.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| **Playwright Headless Chromium E2E Browser Tests** | ${{ steps.e2e.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # JOB 6: SONARQUBE CODE COVERAGE & QUALITY GATE
  # ============================================================================
  sonarqube:
    name: SonarQube - Code Coverage & Quality Gate
    needs: [discover, frontend-tests, java-backends-tests, python-backends-tests]
    if: >-
      !cancelled() &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.java-backends-tests.result == 'success' || needs.java-backends-tests.result == 'skipped') &&
      (needs.python-backends-tests.result == 'success' || needs.python-backends-tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Bytser-com_Essers_Mapping' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'bytser-com' }}
    steps:
      - name: Checkout repository (full history for SonarQube blame & new-code period)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Coverage, Test Report & Bytecode Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts*"
          merge-multiple: true
          path: .

      - name: Validate SonarQube Credentials & Collect Coverage Paths
        id: sonar_prep
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::Missing SONAR_TOKEN secret! Configure SONAR_TOKEN (and SONAR_HOST_URL) in GitHub Repository Secrets to enable SonarQube code coverage analysis."
            exit 1
          fi

          if [ -z "${SONAR_HOST_URL:-}" ]; then
            echo "::error::Missing SONAR_HOST_URL secret/variable! Configure SONAR_HOST_URL in GitHub Repository Secrets or Variables."
            exit 1
          fi

          JACOCO_PATHS=$(find . -path "*/target/site/jacoco/jacoco.xml" | sed 's|^\./||' | paste -sd, - || true)
          JAVA_BINARIES=$(find . -type d -path "*/target/classes" | sed 's|^\./||' | paste -sd, - || true)
          JUNIT_PATHS=$(find . -type d \( -path "*/target/surefire-reports" -o -path "*/target/failsafe-reports" \) | sed 's|^\./||' | paste -sd, - || true)
          PY_COV_PATHS=$(find . -name "coverage.xml" -not -path "./Frontend/*" | sed 's|^\./||' | paste -sd, - || true)
          PY_XUNIT_PATHS=$(find . -name "pytest-junit.xml" | sed 's|^\./||' | paste -sd, - || true)

          EXTRA_ARGS="-Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300"

          if [ -n "${SONAR_ORGANIZATION:-}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} -Dsonar.organization=${SONAR_ORGANIZATION}"
          fi

          if [ -f "Frontend/coverage/lcov.info" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} -Dsonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info"
          fi
          if [ -n "${JACOCO_PATHS}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} -Dsonar.coverage.jacoco.xmlReportPaths=${JACOCO_PATHS}"
          fi
          if [ -n "${JAVA_BINARIES}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} -Dsonar.java.binaries=${JAVA_BINARIES}"
          fi
          if [ -n "${JUNIT_PATHS}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} -Dsonar.junit.reportPaths=${JUNIT_PATHS}"
          fi
          if [ -n "${PY_COV_PATHS}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} -Dsonar.python.coverage.reportPaths=${PY_COV_PATHS}"
          fi
          if [ -n "${PY_XUNIT_PATHS}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} -Dsonar.python.xunit.reportPath=${PY_XUNIT_PATHS}"
          fi

          echo "extra_args=${EXTRA_ARGS}" >> "$GITHUB_OUTPUT"

      - name: Run SonarQube Scanner & Enforce Quality Gate
        id: scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: ${{ steps.sonar_prep.outputs.extra_args }}

      - name: SonarQube Summary
        if: always()
        shell: bash
        run: |
          STATUS="${{ steps.scan.outcome == 'success' && '✅ Passed Quality Gate' || '❌ Quality Gate Failed / Unconfigured' }}"
          {
            echo "### 🔍 SonarQube Code Coverage & Quality Gate: ${STATUS}"
            echo ""
            echo "- **Project Key:** \`${SONAR_PROJECT_KEY}\`"
            if [ -n "${SONAR_HOST_URL:-}" ]; then
              echo "- **SonarQube Dashboard:** [${SONAR_HOST_URL}/dashboard?id=${SONAR_PROJECT_KEY}](${SONAR_HOST_URL}/dashboard?id=${SONAR_PROJECT_KEY})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # JOB 7: FINAL CI QUALITY GATE & UNIFIED EXECUTIVE REPORT
  # ============================================================================
  ci-quality-gate:
    name: CI Quality Gate
    if: always()
    needs:
      - discover
      - frontend-tests
      - java-backends-tests
      - python-backends-tests
      - e2e-tests
      - sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Bytser-com_Essers_Mapping' }}
    steps:
      - name: Download All Test, Coverage & E2E Artifacts for Unified Reporting
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-artifacts*"
          merge-multiple: true
          path: .

      - name: Generate Unified Executive CI, Test & Code Coverage Report
        shell: bash
        run: |
          python3 - << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os, xml.etree.ElementTree as ET

          results = {
              "Service Discovery": "${{ needs.discover.result }}",
              "Frontend (React 19) - Lint, Unit, Functional & Integration": "${{ needs.frontend-tests.result }}",
              "Java Backends (Spring Boot 4) - Unit, Integration & Functional": "${{ needs.java-backends-tests.result }}",
              "Python Backends - Lint, Unit, Functional & Integration": "${{ needs.python-backends-tests.result }}",
              "End-to-End (E2E) - React 19, Nginx & Playwright": "${{ needs.e2e-tests.result }}",
              "SonarQube Code Coverage & Quality Gate": "${{ needs.sonarqube.result }}",
          }

          def badge(res):
              if res == "success": return "✅ Passed"
              if res == "skipped": return "⏭️ Skipped"
              if res == "cancelled": return "🚫 Cancelled"
              return "❌ Failed"

          print("## 🛡️ Essers Mapping — Unified CI & Quality Gate Executive Report\n")
          print("### 1. Pipeline Stage Status")
          print("| Pipeline Stage | Status | Raw Result |")
          print("| :--- | :---: | :---: |")
          for stage, res in results.items():
              print(f"| **{stage}** | {badge(res)} | `{res}` |")

          # Parse all JUnit XML reports across Frontend, Java, Python, and Playwright E2E
          junit_files = (
              glob.glob("Frontend/test-results/*.xml")
              + glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)
              + glob.glob("**/target/failsafe-reports/TEST-*.xml", recursive=True)
              + glob.glob("**/test-results/pytest-junit.xml", recursive=True)
          )

          print("\n### 2. Automated Test Suite Metrics (Unit, Functional, Integration & E2E)")
          if junit_files:
              print("| Test Suite / Report | Total Tests | Passed | Failed | Skipped | Duration |")
              print("| :--- | :---: | :---: | :---: | :---: | :---: |")
              grand_total = grand_passed = grand_failed = grand_skipped = 0
              grand_time = 0.0
              failed_cases = []

              for jf in sorted(set(junit_files)):
                  try:
                      root = ET.parse(jf).getroot()
                      suites = root.findall(".//testsuite") if root.tag == "testsuites" else [root]
                      t = sum(int(s.attrib.get("tests", 0)) for s in suites)
                      f = sum(int(s.attrib.get("failures", 0)) for s in suites)
                      e = sum(int(s.attrib.get("errors", 0)) for s in suites)
                      sk = sum(int(s.attrib.get("skipped", 0)) for s in suites)
                      tm = sum(float(s.attrib.get("time", 0.0)) for s in suites)
                      p = max(0, t - f - e - sk)
                      grand_total += t
                      grand_passed += p
                      grand_failed += (f + e)
                      grand_skipped += sk
                      grand_time += tm
                      print(f"| `{jf}` | `{t}` | `{p}` | `{f + e}` | `{sk}` | `{tm:.2f}s` |")

                      for tc in root.findall(".//testcase"):
                          fail_el = tc.find("failure") or tc.find("error")
                          if fail_el is not None:
                              cname = tc.attrib.get("classname", "")
                              tname = tc.attrib.get("name", "")
                              msg = (fail_el.attrib.get("message", "") or (fail_el.text or "")).strip()[:400]
                              failed_cases.append((jf, f"{cname} :: {tname}", msg))
                  except Exception:
                      pass

              print(f"| **TOTAL** | **`{grand_total}`** | **`{grand_passed}`** | **`{grand_failed}`** | **`{grand_skipped}`** | **`{grand_time:.2f}s`** |")

              if failed_cases:
                  print("\n<details><summary>❌ Click to view Failed Test Cases</summary>\n")
                  for jf, tc_name, msg in failed_cases:
                      print(f"- **`{tc_name}`** (`{jf}`):\n  ```text\n  {msg}\n  ```")
                  print("</details>")
          else:
              print("> No JUnit XML artifacts were collected.")

          # Parse Code Coverage across all stacks
          print("\n### 3. Multi-Language Code Coverage Summary")
          print("| Component / Service | Tool | Line Coverage | Branch Coverage | Details |")
          print("| :--- | :---: | :---: | :---: | :--- |")

          if os.path.exists("Frontend/coverage/coverage-summary.json"):
              with open("Frontend/coverage/coverage-summary.json") as f:
                  fcov = json.load(f).get("total", {})
              l_pct = fcov.get("lines", {}).get("pct", "N/A")
              b_pct = fcov.get("branches", {}).get("pct", "N/A")
              f_pct = fcov.get("functions", {}).get("pct", "N/A")
              print(f"| **Frontend (`React 19`)** | Vitest V8 | **{l_pct}%** | **{b_pct}%** | Functions: `{f_pct}%` |")

          for jxml in sorted(glob.glob("**/target/site/jacoco/jacoco.xml", recursive=True)):
              service = os.path.dirname(os.path.dirname(os.path.dirname(os.path.dirname(jxml))))
              root = ET.parse(jxml).getroot()
              counters = {c.attrib.get("type"): (int(c.attrib.get("covered", 0)), int(c.attrib.get("missed", 0))) for c in root.findall("counter")}
              lc, lm = counters.get("LINE", (0, 0))
              bc, bm = counters.get("BRANCH", (0, 0))
              ic, im = counters.get("INSTRUCTION", (0, 0))
              l_pct = f"{(lc / (lc + lm) * 100):.1f}%" if (lc + lm) > 0 else "100.0%"
              b_pct = f"{(bc / (bc + bm) * 100):.1f}%" if (bc + bm) > 0 else "N/A"
              i_pct = f"{(ic / (ic + im) * 100):.1f}%" if (ic + im) > 0 else "100.0%"
              print(f"| **Java (`{service}`)** | JaCoCo | **{l_pct}** (`{lc}/{lc+lm}`) | **{b_pct}** | Instructions: `{i_pct}` |")

          for pxml in sorted(glob.glob("**/coverage.xml", recursive=True)):
              if pxml.startswith("Frontend/"):
                  continue
              service = os.path.dirname(pxml) or "Python"
              root = ET.parse(pxml).getroot()
              l_pct = float(root.attrib.get("line-rate", 0.0)) * 100.0
              b_pct = float(root.attrib.get("branch-rate", 0.0)) * 100.0
              lv = root.attrib.get("lines-valid", "0")
              lc = root.attrib.get("lines-covered", "0")
              print(f"| **Python (`{service}`)** | pytest-cov | **{l_pct:.1f}%** (`{lc}/{lv}`) | **{b_pct:.1f}%** | Cobertura XML |")

          sonar_url = os.environ.get("SONAR_HOST_URL", "")
          sonar_key = os.environ.get("SONAR_PROJECT_KEY", "Essers_Mapping")
          if sonar_url:
              print(f"\n🔗 **SonarQube Quality Gate & Full Report:** [{sonar_url}/dashboard?id={sonar_key}]({sonar_url}/dashboard?id={sonar_key})")
          PYEOF

      - name: Upload Consolidated HTML & XML Test/Coverage Report Bundle
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ci-consolidated-reports-${{ github.run_id }}
          path: |
            Frontend/coverage/**
            Frontend/playwright-report/**
            Frontend/test-results/**
            **/target/site/jacoco/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/coverage.xml
            **/test-results/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Enforce Pull Request Merge Gate
        shell: bash
        run: |
          set -euo pipefail

          DISCOVER_RES="${{ needs.discover.result }}"
          FRONTEND_RES="${{ needs.frontend-tests.result }}"
          JAVA_RES="${{ needs.java-backends-tests.result }}"
          PYTHON_RES="${{ needs.python-backends-tests.result }}"
          E2E_RES="${{ needs.e2e-tests.result }}"
          SONAR_RES="${{ needs.sonarqube.result }}"

          FAILED=false
          for res in "$DISCOVER_RES" "$FRONTEND_RES" "$E2E_RES" "$SONAR_RES"; do
            if [ "$res" != "success" ]; then
              FAILED=true
            fi
          done

          for optional_res in "$JAVA_RES" "$PYTHON_RES"; do
            if [ "$optional_res" != "success" ] && [ "$optional_res" != "skipped" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "::error::CI Quality Gate failed! One or more test suites or the SonarQube Quality Gate did not pass. Pull Request cannot be merged."
            exit 1
          fi

          echo "✅ All Unit, Functional, Integration, End-to-End (E2E), and SonarQube Code Coverage checks passed!"
