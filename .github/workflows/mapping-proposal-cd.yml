name: Mapping Proposal CD

# Automatic delivery is called once by the CI workflow; this file is manual recovery.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: mapping-proposal-cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  delivery:
    uses: ./.github/workflows/service-cd.yml
    with:
      service-path: Mapping_Proposal
      image-name: mapping-proposal
      deployment: mapping-proposal
      ci-workflow: mapping-proposal-ci.yml
    secrets: inherit
