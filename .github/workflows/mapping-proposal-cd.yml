name: Mapping Proposal CD

on:
  workflow_run:
    workflows: ['Mapping Proposal CI']
    branches: [Testing, main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: mapping-proposal-cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  delivery:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/service-cd.yml
    with:
      service-path: Mapping_Proposal
      image-name: mapping-proposal
      deployment: mapping-proposal
      ci-workflow: mapping-proposal-ci.yml
      artifact-name: mapping-proposal-test-reports
      artifact-path: ''
    secrets: inherit
