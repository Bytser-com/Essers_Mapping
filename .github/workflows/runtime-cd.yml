name: Runtime CD

# Automatic delivery is called once by the CI workflow; this file is manual recovery.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: runtime-cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  delivery:
    uses: ./.github/workflows/service-cd.yml
    with:
      service-path: Runtime
      image-name: runtime-backend
      deployment: runtime-backend
      ci-workflow: runtime-ci.yml
    secrets: inherit
