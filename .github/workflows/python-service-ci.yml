name: Python service CI (reusable)

on:
  workflow_call:
    inputs:
      service-path:
        description: Repository-relative Python service directory
        required: true
        type: string
      artifact-prefix:
        description: Unique prefix for service report artifacts
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Python - lint, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check service readiness
        id: readiness
        run: |
          if [[ ! -f requirements.txt && ! -f pyproject.toml ]]; then
            if [[ -d tests || -n "$(find . -type f -name '*.py' -print -quit)" ]]; then
              echo "::error::Add requirements.txt or an installable pyproject.toml for this Python service."
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Python service CI deferred" >> "$GITHUB_STEP_SUMMARY"
            echo "This directory is a placeholder. Add a dependency manifest and tests/ to activate its checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! -d tests ]]; then
            echo "::error::Add the service's automated tests under tests/."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.readiness.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ${{ inputs.service-path }}/requirements*.txt
            ${{ inputs.service-path }}/pyproject.toml
            .github/requirements/python-ci.txt

      - name: Install CI tools and service dependencies
        if: steps.readiness.outputs.enabled == 'true'
        run: |
          python -m pip install -r "$GITHUB_WORKSPACE/.github/requirements/python-ci.txt"
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install .
          fi
          if [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          fi
          python -m pip check

      - name: Lint Python
        if: steps.readiness.outputs.enabled == 'true'
        run: python -m ruff check .

      # All test categories under tests/ run together; pytest fails if none exist.
      - name: Unit, integration and functional tests with coverage
        if: steps.readiness.outputs.enabled == 'true'
        run: >-
          python -m pytest tests -ra
          --junitxml=test-results/pytest-junit.xml
          --cov=. --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:coverage

      - name: Setup Docker Buildx
        if: steps.readiness.outputs.enabled == 'true' && hashFiles(format('{0}/Dockerfile', inputs.service-path)) != ''
        uses: docker/setup-buildx-action@v4

      - name: Build container for validation
        if: steps.readiness.outputs.enabled == 'true' && hashFiles(format('{0}/Dockerfile', inputs.service-path)) != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service-path }}
          load: true
          push: false
          tags: service-ci:local

      - name: Validate container startup and health
        if: steps.readiness.outputs.enabled == 'true' && hashFiles(format('{0}/Dockerfile', inputs.service-path)) != ''
        working-directory: ${{ github.workspace }}
        env:
          IMAGE: service-ci:local
          SERVICE_PATH: ${{ inputs.service-path }}
        run: bash Scripts/smoke-service-image.sh

      - name: Upload test results and coverage
        if: always() && steps.readiness.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-prefix }}-test-reports
          path: |
            ${{ inputs.service-path }}/test-results/
            ${{ inputs.service-path }}/coverage.xml
            ${{ inputs.service-path }}/coverage/
          if-no-files-found: warn
          retention-days: 14
