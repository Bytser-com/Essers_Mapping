# One combined project: individual service scans must not overwrite each other.
sonar.projectName=Essers Mapping
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.inclusions=Frontend/src/**,Runtime/src/main/java/**,Mapping_Proposal/**/*.py,Mapping_Converter/**/*.py
sonar.test.inclusions=Frontend/src/__tests__/**,Frontend/src/test/**,Frontend/e2e/**,Runtime/src/test/java/**,Mapping_Proposal/tests/**,Mapping_Proposal/**/test_*.py,Mapping_Proposal/**/*_test.py,Mapping_Converter/tests/**,Mapping_Converter/**/test_*.py,Mapping_Converter/**/*_test.py
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/coverage/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/test-results/**,**/playwright-report/**,**/.cache/**
sonar.test.exclusions=**/node_modules/**,**/target/**,**/.venv/**,**/venv/**,**/.cache/**
sonar.coverage.exclusions=Frontend/src/main.tsx,Frontend/src/assets/**

# --- Code Coverage Reports ---
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=Runtime/target/site/jacoco/jacoco.xml
# Match implemented services without requiring a report from README-only placeholders.
sonar.python.coverage.reportPaths=Mapping_*/coverage.xml
sonar.python.version=3.12

# --- Java Bytecode and Test Reports ---
sonar.java.source=21
sonar.java.binaries=Runtime/target/classes
sonar.java.libraries=Runtime/target/sonar-libraries/*.jar
sonar.java.test.binaries=Runtime/target/test-classes
sonar.java.test.libraries=Runtime/target/classes,Runtime/target/sonar-libraries/*.jar
sonar.junit.reportPaths=Runtime/target/surefire-reports,Runtime/target/failsafe-reports

# Local CLI scans enforce the hosted gate. GitHub Actions overrides wait=false
# and checks this analysis separately so only new-code coverage is advisory.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
