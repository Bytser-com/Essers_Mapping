# ==============================================================================
# SonarQube Multi-Language Configuration - Essers Mapping
# Covers:
#   - Frontend (React 19 / JavaScript / TypeScript / Vite) -> LCOV coverage
#   - Java Backends (Spring Boot 4 / Java 21 / Maven)      -> JaCoCo XML coverage
#   - Python Backends (Mapping Converter / Proposal / AI)  -> Cobertura XML coverage
# ==============================================================================

sonar.projectKey=Bytser-com_Essers_Mapping
sonar.organization=bytser-com
sonar.projectName=Essers Mapping
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Index root and restrict via explicit inclusions/exclusions so SonarQube works
# seamlessly as new microservices and modules are added across branches.
sonar.sources=.
sonar.tests=.

# Source code inclusions (Frontend React, Java Spring Boot, Python Backends)
sonar.inclusions=\
  Frontend/src/**/*,\
  Runtime/**/src/main/java/**/*,\
  Version_Control/**/src/main/java/**/*,\
  Mapping_Converter/**/*.py,\
  Mapping_Proposal/**/*.py,\
  ai_tool/**/*.py

# Test file inclusions (Unit, Integration, Functional, and E2E tests)
sonar.test.inclusions=\
  Frontend/src/**/*.{test,spec}.{js,jsx,ts,tsx},\
  Frontend/src/__tests__/**/*,\
  Frontend/e2e/**/*.{test,spec}.{js,jsx,ts,tsx},\
  Runtime/**/src/test/java/**/*,\
  Version_Control/**/src/test/java/**/*,\
  Mapping_Converter/**/test_*.py,\
  Mapping_Converter/**/*_test.py,\
  Mapping_Converter/**/tests/**/*.py,\
  Mapping_Proposal/**/test_*.py,\
  Mapping_Proposal/**/*_test.py,\
  Mapping_Proposal/**/tests/**/*.py,\
  ai_tool/**/test_*.py,\
  ai_tool/**/*_test.py,\
  ai_tool/**/tests/**/*.py

# Global exclusions (build outputs, dependencies, infra state, static assets, tests from source coverage)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/.scannerwork/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/venv/**,\
  Infra/**,\
  Kubernetes/**,\
  Scripts/**,\
  docs/**,\
  Frontend/src/main.jsx,\
  Frontend/src/main.tsx,\
  Frontend/src/test/**,\
  Frontend/src/__tests__/**,\
  Frontend/src/**/*.{test,spec}.{js,jsx,ts,tsx},\
  Frontend/e2e/**,\
  Runtime/**/src/test/**,\
  Version_Control/**/src/test/**,\
  **/test_*.py,\
  **/*_test.py,\
  **/tests/**

# --- Code Coverage Reports ---
# Frontend (Vitest V8 LCOV)
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info

# Java Spring Boot 4 Backends (JaCoCo XML - dynamically augmented in CI for all Maven modules)
sonar.coverage.jacoco.xmlReportPaths=Runtime/Runtime/target/site/jacoco/jacoco.xml

# Python Backends (pytest-cov XML - dynamically augmented in CI for all Python services)
sonar.python.coverage.reportPaths=Mapping_Converter/coverage.xml,Mapping_Proposal/coverage.xml,ai_tool/coverage.xml

# --- Java Bytecode & JUnit Test Reports ---
sonar.java.source=21
sonar.java.binaries=Runtime/Runtime/target/classes
sonar.junit.reportPaths=Runtime/Runtime/target/surefire-reports,Runtime/Runtime/target/failsafe-reports
sonar.python.xunit.reportPath=Mapping_Converter/test-results/pytest-junit.xml,Mapping_Proposal/test-results/pytest-junit.xml,ai_tool/test-results/pytest-junit.xml
