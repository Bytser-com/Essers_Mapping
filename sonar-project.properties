# One combined project: individual service scans must not overwrite each other.
sonar.projectName=Essers Mapping
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.inclusions=Frontend/src/**,Runtime/src/main/java/**,Version_Control/src/main/java/**,Mapping_Proposal/**/*.py,Mapping_Converter/**/*.py
sonar.test.inclusions=Frontend/src/__tests__/**,Frontend/src/test/**,Frontend/e2e/**,Runtime/src/test/java/**,Version_Control/src/test/java/**,Mapping_Proposal/tests/**,Mapping_Proposal/**/test_*.py,Mapping_Proposal/**/*_test.py,Mapping_Converter/tests/**,Mapping_Converter/**/test_*.py,Mapping_Converter/**/*_test.py
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/coverage/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/test-results/**,**/playwright-report/**,**/.cache/**
sonar.test.exclusions=**/node_modules/**,**/target/**,**/.venv/**,**/venv/**,**/.cache/**
sonar.coverage.exclusions=Frontend/src/main.tsx,Frontend/src/assets/**

# --- Duplication ---
# Mapping_Proposal and Mapping_Converter each keep their own copy of the shared
# storage and error code on purpose: every Python service is built from its own
# Docker context (python-service-ci.yml / service-cd.yml: context = service path),
# so a service cannot import code from another service. Only the Converter copies
# are excluded from duplication detection; they are still analysed for issues and
# coverage.
sonar.cpd.exclusions=Mapping_Converter/services/storage.py,Mapping_Converter/scripts/safe_files.py,Mapping_Converter/scripts/errors.py

# --- Code Coverage Reports ---
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=Runtime/target/site/jacoco/jacoco.xml,Version_Control/target/site/jacoco/jacoco.xml
# Match implemented services without requiring a report from README-only placeholders.
sonar.python.coverage.reportPaths=Mapping_*/coverage.xml
sonar.python.version=3.12

# --- Java Bytecode and Test Reports ---
sonar.java.source=21
sonar.java.binaries=Runtime/target/classes,Version_Control/target/classes
sonar.java.libraries=Runtime/target/sonar-libraries/*.jar,Version_Control/target/sonar-libraries/*.jar
sonar.java.test.binaries=Runtime/target/test-classes,Version_Control/target/test-classes
sonar.java.test.libraries=Runtime/target/classes,Version_Control/target/classes,Runtime/target/sonar-libraries/*.jar,Version_Control/target/sonar-libraries/*.jar
sonar.junit.reportPaths=Runtime/target/surefire-reports,Runtime/target/failsafe-reports,Version_Control/target/surefire-reports,Version_Control/target/failsafe-reports

# Local CLI scans enforce the server gate. GitHub Actions overrides wait=false
# and checks this analysis separately via Scripts/check-sonar-quality-gate.py.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
