# Local SFTP server for development, used instead of the shared SFTPGo server of the
# cluster (which is not reachable from outside the Proxmox network).
#
#   docker compose -f docker-compose.sftp.yml up -d      start
#   docker compose -f docker-compose.sftp.yml down       stop
#
# Same user and folder as in Kubernetes (shareduser, /upload), so only host and port differ.
# Settings for Mapping_Proposal/.env:
#   SFTP_SHARED_HOST=localhost
#   SFTP_SHARED_PORT=2222
#   SFTP_SHARED_USER=shareduser
#   SFTP_SHARED_PASSWORD=devpassword
#   SFTP_SHARED_REMOTE_DIR=/upload
#
# The files on the server are visible in data/sftp-server/ (data/ is not in Git).
services:
  sftp:
    image: atmoz/sftp:alpine
    container_name: essers-sftp
    # user:password:uid:gid:folder  -> /home/shareduser/upload (shown as /upload after login)
    command: shareduser:devpassword:1000:1000:upload
    ports:
      - "2222:22"
    volumes:
      - ./data/sftp-server:/home/shareduser/upload
    restart: unless-stopped
