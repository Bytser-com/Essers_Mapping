spring.application.name=Runtime
management.endpoint.health.probes.enabled=true

# Swagger / OpenAPI documentation (runs on /docs, redirects from /swagger)
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# Shared SFTP storage with the mapping packages (same variables as Version_Control)
sftp.shared.host=${SFTP_SHARED_HOST:localhost}
sftp.shared.port=${SFTP_SHARED_PORT:2222}
sftp.shared.user=${SFTP_SHARED_USER:shareduser}
sftp.shared.password=${SFTP_SHARED_PASSWORD:}
sftp.shared.packages-path=${SFTP_SHARED_PACKAGES_DIR:/Packages}
sftp.shared.allow-unknown-keys=${SFTP_ALLOW_UNKNOWN_KEYS:true}
