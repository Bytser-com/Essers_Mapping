spring.application.name=Runtime
server.port=${RUNTIME_SERVER_PORT:8080}

# Actuator & Prometheus scraping (/actuator/prometheus)
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Swagger / OpenAPI documentation (runs on /docs, redirects from /swagger)
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# Shared SFTP storage with the mapping packages (same variables as Version_Control)
sftp.shared.host=${SFTP_SHARED_HOST:localhost}
sftp.shared.port=${SFTP_SHARED_PORT:2222}
sftp.shared.user=${SFTP_SHARED_USER:shareduser}
sftp.shared.password=${SFTP_SHARED_PASSWORD:}
sftp.shared.packages-path=${SFTP_SHARED_PACKAGES_DIR:/Packages}
sftp.shared.allow-unknown-keys=${SFTP_ALLOW_UNKNOWN_KEYS:true}
sftp.shared.timeout-ms=${SFTP_SHARED_TIMEOUT_MS:10000}
sftp.shared.pool-size=${SFTP_SHARED_POOL_SIZE:10}

# Runtime SFTP connection (credentials strictly via environment variables / .env)
sftp.runtime.host=${SFTP_RUNTIME_HOST:localhost}
sftp.runtime.port=${SFTP_RUNTIME_PORT:2223}
sftp.runtime.user=${SFTP_RUNTIME_USER:runtimeuser}
sftp.runtime.password=${SFTP_RUNTIME_PASSWORD:}
sftp.runtime.private-key=${SFTP_RUNTIME_PRIVATE_KEY:}
sftp.runtime.private-key-passphrase=${SFTP_RUNTIME_PRIVATE_KEY_PASSPHRASE:}
sftp.runtime.known-hosts=${SFTP_KNOWN_HOSTS:}
sftp.runtime.remote-dir=${SFTP_RUNTIME_REMOTE_DIR:/Clients}
sftp.runtime.allow-unknown-keys=${SFTP_ALLOW_UNKNOWN_KEYS:false}
sftp.runtime.session-wait-timeout-ms=${SFTP_RUNTIME_SESSION_WAIT_TIMEOUT_MS:10000}
sftp.runtime.connect-timeout-ms=${SFTP_RUNTIME_CONNECT_TIMEOUT_MS:10000}
sftp.runtime.max-file-size-bytes=${SFTP_RUNTIME_MAX_FILE_SIZE_BYTES:26214400}

# Adaptive drain-loop poller & bounded parallel worker pool
runtime.poller.enabled=${RUNTIME_POLLER_ENABLED:true}
runtime.poller.base-interval-ms=${RUNTIME_POLLER_BASE_INTERVAL_MS:5000}
runtime.poller.max-jitter-ms=${RUNTIME_POLLER_MAX_JITTER_MS:1500}
runtime.poller.min-file-age-ms=${RUNTIME_POLLER_MIN_FILE_AGE_MS:3000}
runtime.poller.worker-concurrency=${RUNTIME_WORKER_CONCURRENCY:4}
runtime.poller.stale-claim-timeout-ms=${RUNTIME_POLLER_STALE_CLAIM_TIMEOUT_MS:300000}
runtime.poller.stale-recovery-interval-ms=${RUNTIME_POLLER_STALE_RECOVERY_INTERVAL_MS:60000}
runtime.poller.shutdown-await-seconds=${RUNTIME_POLLER_SHUTDOWN_AWAIT_SECONDS:20}
runtime.poller.instance-id=${RUNTIME_POLLER_INSTANCE_ID:${HOSTNAME:}}
