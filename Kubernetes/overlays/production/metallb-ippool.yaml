# ==============================================================================
# METALLB L2 IP ADDRESS POOL CONFIGURATION (PRODUCTION: 192.168.100.201 - .203)
# Apply this after installing MetalLB (`kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml`)
# so your bare-metal Proxmox Kubernetes cluster advertises the dedicated IPs via ARP.
# ==============================================================================
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: essers-production-ip-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.100.201-192.168.100.203
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: essers-production-l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - essers-production-ip-pool
