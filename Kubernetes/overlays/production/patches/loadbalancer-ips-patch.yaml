# ==============================================================================
# PRODUCTION ENVIRONMENT: DEDICATED PUBLIC LOADBALANCER IPs
#   - 192.168.100.201 -> frontend (Ports 80, 443)
#   - 192.168.100.202 -> sftp-shared (Port 22)
#   - 192.168.100.203 -> sftp-runtime (Port 22)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.201"
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.100.201"
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-shared
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.202"
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.100.202"
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-runtime
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.203"
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.100.203"
