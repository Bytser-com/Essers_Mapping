# ==============================================================================
# PRODUCTION HORIZONTAL POD AUTOSCALERS (HPA) WITH +1 HOT SPARE
# - Preparation Services: 2 minimum + 1 hot spare = 3 baseline replicas (max 4)
# - Shared SFTPGo:        2 minimum + 1 hot spare = 3 baseline replicas (max 4)
# - Runtime Services:     2 minimum + 1 hot spare = 3 baseline replicas (max 5)
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  # 2 minimum active + 1 hot spare = 3 running pods at all times, scaling up to 4
  minReplicas: 3
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
