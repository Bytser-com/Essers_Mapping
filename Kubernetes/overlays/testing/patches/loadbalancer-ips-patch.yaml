# ==============================================================================
# TESTING ENVIRONMENT: DEDICATED PUBLIC LOADBALANCER IPs
#   - 192.168.100.101 -> frontend (Ports 80, 443)
#   - 192.168.100.102 -> sftp-shared (Port 22)
#   - 192.168.100.103 -> sftp-runtime (Port 22)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.101"
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.100.101"
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-shared
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.102"
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.100.102"
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-runtime
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.103"
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.100.103"
