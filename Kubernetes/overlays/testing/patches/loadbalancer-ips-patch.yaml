# ==============================================================================
# TESTING ENVIRONMENT: DEDICATED PUBLIC LOADBALANCER IPs & INGRESS PATCH
#   - 192.168.100.101 -> ingress-nginx-controller (Ports 80, 443 -> frontend:8080)
#   - 192.168.100.102 -> sftp-shared (Port 22, 8080)
#   - 192.168.100.103 -> sftp-runtime (Port 22, 8080)
# Hostname: testing-essers.shystack.com
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: essers-frontend-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - testing-essers.shystack.com
      secretName: essers-frontend-testing-tls
  rules:
    - host: testing-essers.shystack.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
    # Fallback rule for local IP access
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-shared
  annotations:
    metallb.io/loadBalancerIPs: "192.168.100.102"
spec:
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-runtime
  annotations:
    metallb.io/loadBalancerIPs: "192.168.100.103"
spec:
  type: LoadBalancer
