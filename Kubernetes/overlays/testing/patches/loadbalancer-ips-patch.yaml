# ==============================================================================
# TESTING ENVIRONMENT: DEDICATED PUBLIC LOADBALANCER IPs & INGRESS PATCH
#   - 192.168.100.101 -> ingress-nginx-controller (Ports 80, 443 -> frontend:8080)
#   - 192.168.100.102 -> sftp-shared (Port 22, 8080)
#   - 192.168.100.103 -> sftp-runtime (Port 22, 8080)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: essers-frontend-ingress
  annotations:
    # Use "selfsigned-cluster-issuer" when testing on private LAN (192.168.100.101) without public DNS,
    # or switch to "letsencrypt-prod" / "letsencrypt-staging" when a public domain points to .101.
    cert-manager.io/cluster-issuer: "selfsigned-cluster-issuer"
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-shared
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.102"
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.100.102"
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-runtime
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.100.103"
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.100.103"
