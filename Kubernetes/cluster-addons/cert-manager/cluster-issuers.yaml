# ==============================================================================
# CERT-MANAGER CLUSTER ISSUERS (DNS-01 CHALLENGE VIA CLOUDFLARE)
# Works for clusters behind NAT/firewalls without forwarded inbound ports 80/443.
# ==============================================================================

# 1. Let's Encrypt Production ClusterIssuer (DNS-01 Challenge via Cloudflare API)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
---
# 2. Let's Encrypt Staging ClusterIssuer (for testing DNS-01 without rate limits)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: your-email@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
---
# 3. Self-Signed ClusterIssuer (Fallback for local offline testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
spec:
  selfSigned: {}
