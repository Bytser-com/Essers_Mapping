# ==============================================================================
# CERT-MANAGER CLUSTER ISSUERS
# Prerequisite: Install cert-manager in the cluster:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
#   kubectl wait --namespace cert-manager --for=condition=ready pod --selector=app.kubernetes.io/instance=cert-manager --timeout=120s
#
# Then apply this file:
#   kubectl apply -f Kubernetes/cluster-addons/cert-manager/cluster-issuers.yaml
# ==============================================================================

# 1. Let's Encrypt Production ClusterIssuer (HTTP-01 challenge via NGINX Ingress)
#    Requires a public DNS record pointing your domain to the Ingress LoadBalancer IP (ports 80 & 443 reachable from the internet).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# 2. Let's Encrypt Staging ClusterIssuer (for testing ACME without rate limits)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: your-email@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# 3. Self-Signed ClusterIssuer (Fallback for Private LAN / 192.168.100.x Testing without Public DNS)
#    Automatically issues & renews TLS certificates inside private networks where Let's Encrypt cannot reach port 80.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
spec:
  selfSigned: {}
