# ==============================================================================
# GRAFANA ALLOY KUBERNETES RBAC
# Grants Alloy permissions to discover pods and nodes for metadata labeling.
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-k8s
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy-k8s
    app.kubernetes.io/part-of: essers-mapping
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-k8s
  labels:
    app.kubernetes.io/name: alloy-k8s
    app.kubernetes.io/part-of: essers-mapping
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs:
    - /metrics
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-k8s
  labels:
    app.kubernetes.io/name: alloy-k8s
    app.kubernetes.io/part-of: essers-mapping
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-k8s
subjects:
  - kind: ServiceAccount
    name: alloy-k8s
    namespace: monitoring
