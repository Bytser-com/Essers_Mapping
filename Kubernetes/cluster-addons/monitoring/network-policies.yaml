# ==============================================================================
# CALICO ZERO-TRUST NETWORK POLICIES FOR MONITORING NAMESPACE
# Strict isolation ensuring:
#   1. External access to Grafana is ONLY permitted through the Ingress Controller.
#   2. Prometheus can scrape telemetry from authorized targets (nodes, kubelet, apps).
#   3. Unauthorized cross-namespace traffic is blocked.
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-monitoring-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 1. GRAFANA INGRESS: Allow TCP 3000 exclusively from Ingress-Nginx Controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
# 2. PROMETHEUS INGRESS: Allow query access from Grafana and telemetry push from Alloy on VMs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - ipBlock:
            cidr: 192.168.100.0/24
      ports:
        - protocol: TCP
          port: 9090
---
# 3. ALERTMANAGER INGRESS: Allow alert notifications from Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-alertmanager
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9093
---
# 4. PROMETHEUS EGRESS: Allow scraping node telemetry, API server, and workloads
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-scrape
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    # DNS Resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API Server
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
    # Node Exporter (9100) & Kubelet / cAdvisor (10250)
    - ports:
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 10250
    # Kube-State-Metrics & Ingress-Nginx Metrics
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 10254
    # Alertmanager (9093)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    # Scrape Essers Workloads across namespaces (8000, 8080)
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - essers-mapping-testing
                  - essers-mapping-production
                  - essers-mapping
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
---
# 5. LOKI INGRESS: Allow log ingestion from Alloy and log queries from Grafana
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-loki
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-k8s
        - ipBlock:
            cidr: 192.168.100.0/24
      ports:
        - protocol: TCP
          port: 3100
---
# 6. ALLOY DAEMONSET EGRESS: Allow streaming logs to Loki & resolving DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-k8s
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
