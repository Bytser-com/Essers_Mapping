# ==============================================================================
# CALICO ZERO-TRUST NETWORK POLICIES FOR MONITORING NAMESPACE
# Strict isolation ensuring:
#   1. External access to Grafana is ONLY permitted through the Ingress Controller.
#   2. Prometheus can scrape telemetry from authorized targets (monitoring stack,
#      nodes, kubelet/cAdvisor, CoreDNS, ingress-nginx, and Essers apps).
#   3. Unauthorized cross-namespace traffic is blocked.
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-monitoring-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 1. GRAFANA INGRESS: Allow TCP 3000 from Ingress-Nginx Controller and Prometheus metrics scrape
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3000
---
# 2. PROMETHEUS INGRESS: Allow query access from Grafana, self-scrape, and telemetry push from Alloy on VMs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - ipBlock:
            cidr: 192.168.100.0/24
      ports:
        - protocol: TCP
          port: 9090
---
# 3. ALERTMANAGER INGRESS: Allow alert notifications and metrics scrape from Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-alertmanager
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9093
---
# 4. MONITORING INTERNAL TARGETS INGRESS: Allow Prometheus to scrape kube-state-metrics,
#    Prometheus Operator, and Alloy inside the monitoring namespace (required by default-deny).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-monitoring-components
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 12345
---
# 5. PROMETHEUS OPERATOR WEBHOOK INGRESS: Allow Kubernetes API server admission webhook calls
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-prometheus-operator
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
---
# 6. PROMETHEUS EGRESS: Allow scraping node telemetry, API server, monitoring stack, and workloads
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-scrape
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    # DNS Resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API Server
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
    # Node Exporter (9100), CoreDNS (9153), Kubelet / cAdvisor (10250)
    - ports:
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 9153
        - protocol: TCP
          port: 10250
    # Kube-State-Metrics (8080/8081) & Ingress-Nginx Metrics (10254)
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 10254
    # Monitoring stack self-scrapes & Alertmanager inside monitoring namespace
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 12345
    # Scrape Essers Workloads across namespaces (8000, 8080)
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - essers-mapping-testing
                  - essers-mapping-production
                  - essers-mapping
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
---
# 7. LOKI INGRESS: Allow log ingestion from Alloy and log queries / scrapes from Grafana & Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-loki
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-k8s
        - ipBlock:
            cidr: 192.168.100.0/24
      ports:
        - protocol: TCP
          port: 3100
---
# 8. ALLOY DAEMONSET EGRESS: Allow streaming logs to Loki & resolving DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-k8s
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
