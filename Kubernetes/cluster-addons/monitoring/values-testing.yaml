# ==============================================================================
# PROMETHEUS & GRAFANA MONITORING HELM VALUES — TESTING ENVIRONMENT
# Chart: prometheus-community/kube-prometheus-stack
# Target: Testing Cluster (MetalLB Ingress IP: 192.168.100.101)
# ==============================================================================
# Install command:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring \
#     --create-namespace \
#     -f Kubernetes/cluster-addons/monitoring/values-testing.yaml
# ==============================================================================

# Global configuration
nameOverride: "k8s-mon"
fullnameOverride: "kube-prometheus-stack"

# ------------------------------------------------------------------------------
# 1. GRAFANA DASHBOARD PLATFORM (TESTING)
# ------------------------------------------------------------------------------
grafana:
  enabled: true
  replicas: 1

  # Force deployment on worker nodes
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

  # Admin credentials (can also be overridden via an existing Secret)
  admin:
    existingSecret: ""
    userKey: admin-user
    passwordKey: admin-password
  adminUser: "admin"
  adminPassword: "TestingSecureAdminPassword2026!"

  # Hardened security context compliant with Pod Security Standards (Restricted)
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Ingress routing via NGINX Ingress Controller on 192.168.100.101
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-staging"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    hosts:
      - grafana.testing.essers.local
      - grafana-test.example.com
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: grafana-testing-tls
        hosts:
          - grafana.testing.essers.local
          - grafana-test.example.com

  # Persistent storage via Longhorn (Testing: 5Gi RWO)
  persistence:
    type: pvc
    enabled: true
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection

  # Resource sizing tuned for 1-worker testing node
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

  # Automatic Dashboards & Datasources discovery via GitOps ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: k8s-sidecar-target-directory
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  grafana.ini:
    server:
      root_url: "https://grafana.testing.essers.local"
      serve_from_sub_path: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
    security:
      cookie_secure: true
      disable_gravatar: true
      allow_embedding: false

# ------------------------------------------------------------------------------
# 2. PROMETHEUS TIME-SERIES METRICS ENGINE (TESTING)
# ------------------------------------------------------------------------------
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 8GiB

    nodeSelector:
      node-role.kubernetes.io/worker: "worker"

    # Scrape ServiceMonitors and PodMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}

    # Enable Prometheus Remote-Write receiver for Grafana Alloy push metrics
    enableRemoteWriteReceiver: true

    # Scrape intervals
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Persistent Storage using Longhorn (Testing: 10Gi)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Sizing for testing VM
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 800m
        memory: 1536Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

# ------------------------------------------------------------------------------
# 3. ALERTMANAGER (TESTING)
# ------------------------------------------------------------------------------
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1
    retention: 120h

    nodeSelector:
      node-role.kubernetes.io/worker: "worker"

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace", "job"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "discord-notifications"
      routes:
        - matchers:
            - severity =~ "critical|warning"
          receiver: "discord-notifications"
    receivers:
      - name: "discord-notifications"
        discord_configs:
          - webhook_url: "https://discord.com/api/webhooks/PLACEHOLDER_DISCORD_WEBHOOK_URL"
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🚨 [FIRING:{{ .Alerts.Firing | len }}]{{ else }}✅ [RESOLVED]{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            message: '{{ range .Alerts }}**Alert:** {{ .Annotations.summary }}\n**Description:** {{ .Annotations.description }}\n**Severity:** `{{ .Labels.severity }}`\n**Pod:** `{{ .Labels.pod }}`\n\n{{ end }}'

# ------------------------------------------------------------------------------
# 4. KUBE-STATE-METRICS & EXPORTERS (CLUSTER INFRASTRUCTURE TELEMETRY)
# ------------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Pre-packaged Core Kubernetes Dashboards
defaultRules:
  create: true
  rules:
    etcd: false  # Running managed or external etcd without direct metric scrape
