# ==============================================================================
# PROMETHEUS & GRAFANA MONITORING HELM VALUES — TESTING ENVIRONMENT
# Chart: prometheus-community/kube-prometheus-stack
# Target: Testing Cluster (MiniPC Worker: 8 vCPU / 8 GiB RAM / 128 GB Disk)
# Ingress LoadBalancer IP: 192.168.100.101
# ==============================================================================
# Install command:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring \
#     --create-namespace \
#     -f Kubernetes/cluster-addons/monitoring/values-testing.yaml
# ==============================================================================

# Global configuration
nameOverride: "k8s-mon"
fullnameOverride: "kube-prometheus-stack"

# ------------------------------------------------------------------------------
# 0. PROMETHEUS OPERATOR (TESTING — MiniPC bounded resources)
# ------------------------------------------------------------------------------
prometheusOperator:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# ------------------------------------------------------------------------------
# 1. GRAFANA DASHBOARD PLATFORM (TESTING)
# ------------------------------------------------------------------------------
grafana:
  enabled: true
  replicas: 1

  # Force deployment on worker nodes
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

  # Admin credentials linked to dedicated Kubernetes Secret (from GRAFANA_ADMIN_PASSWORD)
  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password

  # Hardened security context compliant with Pod Security Standards (Restricted)
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Ingress routing via NGINX Ingress Controller on 192.168.100.101
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-staging"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    hosts:
      - monitor-testing.shystack.com
      - grafana.testing.essers.local
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: grafana-testing-tls
        hosts:
          - monitor-testing.shystack.com
          - grafana.testing.essers.local

  # Persistent storage via Longhorn (Testing: 5Gi RWO)
  persistence:
    type: pvc
    enabled: true
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection

  # Resource sizing tuned for 1-worker MiniPC testing VM (8 vCPU / 8 GiB RAM)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

  # Automatic Dashboards & Datasources discovery via GitOps ConfigMaps
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: k8s-sidecar-target-directory
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  grafana.ini:
    server:
      root_url: "https://monitor-testing.shystack.com"
      serve_from_sub_path: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
    security:
      cookie_secure: true
      disable_gravatar: true
      allow_embedding: false

# ------------------------------------------------------------------------------
# 2. PROMETHEUS TIME-SERIES METRICS ENGINE (TESTING)
# ------------------------------------------------------------------------------
prometheus:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      - targetLabel: cluster
        replacement: testing

  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 8GiB
    externalUrl: "https://monitor-testing.shystack.com"
    externalLabels:
      cluster: testing
      environment: testing

    nodeSelector:
      node-role.kubernetes.io/worker: "worker"

    # Scrape ServiceMonitors and PodMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}

    # Enable Prometheus Remote-Write receiver for Grafana Alloy push metrics
    enableRemoteWriteReceiver: true

    # Scrape intervals tuned for MiniPC overhead
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Persistent Storage using Longhorn (Testing: 10Gi PVC with 8GiB TSDB cap)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Sizing for MiniPC testing worker VM (8 vCPU / 8 GiB RAM)
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 1280Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

# ------------------------------------------------------------------------------
# 3. ALERTMANAGER & REFINED DISCORD NOTIFICATIONS (TESTING)
# ------------------------------------------------------------------------------
alertmanager:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      - targetLabel: cluster
        replacement: testing

  alertmanagerSpec:
    replicas: 1
    retention: 120h
    externalUrl: "https://monitor-testing.shystack.com"

    nodeSelector:
      node-role.kubernetes.io/worker: "worker"

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  config:
    global:
      resolve_timeout: 5m

    # Prevent cascading alert storms (e.g., pod alerts when node/service is already down)
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["alertname", "namespace"]
      - source_matchers:
          - alertname = "NodeNotReady"
        target_matchers:
          - alertname =~ "Pod.*|Container.*|ServiceZeroReplicasAvailable"
        equal: ["cluster"]
      - source_matchers:
          - alertname = "ServiceZeroReplicasAvailable"
        target_matchers:
          - alertname =~ "PodFrequentRestarts|PodCrashLooping|ContainerNearMemoryLimit"
        equal: ["namespace"]

    route:
      group_by: ["cluster", "alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "discord-notifications"
      routes:
        # Silence built-in kube-prometheus-stack heartbeat/info alerts
        - matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
          receiver: "null"
        # Fast escalation for critical outages
        - matchers:
            - severity = "critical"
          receiver: "discord-notifications"
          group_wait: 15s
          group_interval: 2m
          repeat_interval: 1h
        # Dedicated grouping for Mapping Proposal & AI pipeline alerts
        - matchers:
            - category = "proposals"
          receiver: "discord-notifications"
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 2h
        # Standard warnings (debounced to reduce testing noise)
        - matchers:
            - severity = "warning"
          receiver: "discord-notifications"
          group_wait: 45s
          group_interval: 5m
          repeat_interval: 4h

    receivers:
      - name: "null"
      - name: "discord-notifications"
        discord_configs:
          - webhook_url: "https://discord.com/api/webhooks/PLACEHOLDER_DISCORD_WEBHOOK_URL"
            send_resolved: true
            title: >-
              {{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}🔴 [TESTING][CRITICAL]{{ else }}🟠 [TESTING][WARNING]{{ end }} {{ .CommonLabels.alertname }} ({{ .Alerts.Firing | len }}){{ else }}✅ [TESTING][RESOLVED] {{ .CommonLabels.alertname }}{{ end }}
            message: |-
              {{ range .Alerts }}**{{ .Annotations.summary }}**
              {{ .Annotations.description }}
              {{- if .Labels.namespace }}
              • **Namespace:** `{{ .Labels.namespace }}`{{ end }}
              {{- if .Labels.deployment }}
              • **Deployment:** `{{ .Labels.deployment }}`{{ end }}
              {{- if .Labels.pod }}
              • **Pod:** `{{ .Labels.pod }}`{{ end }}
              {{- if .Labels.persistentvolumeclaim }}
              • **PVC:** `{{ .Labels.persistentvolumeclaim }}`{{ end }}
              {{- if .Labels.node }}
              • **Node:** `{{ .Labels.node }}`{{ end }}
              {{- if .Labels.instance }}
              • **Instance:** `{{ .Labels.instance }}`{{ end }}
              {{- if .Annotations.runbook }}
              • **Actie:** {{ .Annotations.runbook }}{{ end }}
              {{- if .Annotations.dashboard_uid }}
              • **Grafana:** https://monitor-testing.shystack.com/d/{{ .Annotations.dashboard_uid }}{{ else }}
              • **Grafana:** https://monitor-testing.shystack.com/d/essers-k8s-cluster-overview{{ end }}

              {{ end }}

# ------------------------------------------------------------------------------
# 4. KUBE-STATE-METRICS, KUBELET & CLUSTER SCRAPE TARGETS (TESTING)
# Inject `cluster="testing"` into all cluster/pod metrics so Grafana filters work.
# ------------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  prometheus:
    monitor:
      metricRelabelings:
        - targetLabel: cluster
          replacement: testing

kubelet:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      - targetLabel: cluster
        replacement: testing
    cAdvisorMetricRelabelings:
      - targetLabel: cluster
        replacement: testing

coreDns:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      - targetLabel: cluster
        replacement: testing

kubeApiServer:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      - targetLabel: cluster
        replacement: testing

# Kubeadm control-plane daemons bind to 127.0.0.1 by default; disable unreachable
# targets so Prometheus /targets stays 100% healthy (UP).
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Node telemetry is collected natively on VM hosts by Ansible and Grafana Alloy
nodeExporter:
  enabled: false

prometheus-node-exporter:
  enabled: false

# Pre-packaged Core Kubernetes Dashboards & Rules
defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
