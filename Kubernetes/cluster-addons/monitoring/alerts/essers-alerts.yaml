# ==============================================================================
# PROMETHEUS ALERTING RULES: ESSERS MAPPING WORKLOADS & CLUSTER HEALTH
# Automatically discovered by Prometheus Operator (CRD: PrometheusRule)
# Evaluated every 15-30s; alerts are dispatched through Alertmanager.
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: essers-mapping-alerts
  namespace: monitoring
  labels:
    role: alert-rules
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: essers-mapping
spec:
  groups:
    - name: essers-workload-alerts
      rules:
        # ----------------------------------------------------------------------
        # 1. Pod CrashLoopBackOff or Frequent Restarts
        # ----------------------------------------------------------------------
        - alert: PodFrequentRestarts
          expr: sum by (pod, namespace) (increase(kube_pod_container_status_restarts_total{namespace=~"essers-mapping-.*"}[15m])) > 3
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently"
            description: "Pod has restarted more than 3 times in the last 15 minutes. Check container logs in Grafana."

        # ----------------------------------------------------------------------
        # 2. Complete Service Outage (0 Replicas Available)
        # ----------------------------------------------------------------------
        - alert: ServiceZeroReplicasAvailable
          expr: kube_deployment_status_replicas_available{namespace=~"essers-mapping-.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service outage: {{ $labels.deployment }} has 0 available replicas"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has zero running/ready pods."

        # ----------------------------------------------------------------------
        # 3. Persistent Volume (Longhorn PVC) Filling Up
        # ----------------------------------------------------------------------
        - alert: PvcStorageSpaceCritical
          expr: 100 * (kubelet_volume_stats_used_bytes{namespace=~"essers-mapping-.*"} / kubelet_volume_stats_capacity_bytes{namespace=~"essers-mapping-.*"}) > 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is over 85% full"
            description: "Volume {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} has less than 15% free space remaining."

        # ----------------------------------------------------------------------
        # 4. Container Near Memory Limit (OOMKill Risk)
        # ----------------------------------------------------------------------
        - alert: ContainerNearMemoryLimit
          expr: 100 * (container_memory_working_set_bytes{namespace=~"essers-mapping-.*", container!=""} / container_spec_memory_limit_bytes{namespace=~"essers-mapping-.*", container!=""}) > 90
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} in pod {{ $labels.pod }} near OOM limit"
            description: "Container memory working set is above 90% of configured memory limit."

        # ----------------------------------------------------------------------
        # 5. Ingress HTTP 5xx Server Error Rate Spike
        # ----------------------------------------------------------------------
        - alert: IngressHigh5xxErrorRate
          expr: sum(rate(nginx_ingress_controller_requests{status=~"5.*"}[5m])) / sum(rate(nginx_ingress_controller_requests[5m])) * 100 > 5
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Edge Ingress 5xx error rate exceeds 5%"
            description: "More than 5% of all incoming requests to the NGINX Ingress controller are returning HTTP 5xx errors."
