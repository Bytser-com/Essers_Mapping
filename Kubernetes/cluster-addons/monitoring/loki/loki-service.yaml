# ==============================================================================
# GRAFANA LOKI SERVICE
# ClusterIP service exposing Loki ingestion & query API on port 3100.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: essers-mapping
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 3100
      targetPort: 3100
      protocol: TCP
    - name: grpc
      port: 9096
      targetPort: 9096
      protocol: TCP
  selector:
    app.kubernetes.io/name: loki
