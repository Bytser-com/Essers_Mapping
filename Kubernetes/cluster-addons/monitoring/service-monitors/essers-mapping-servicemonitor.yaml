# ==============================================================================
# SERVICEMONITOR: ESSERS MAPPING APPLICATION METRICS
# Automatically discovered by Prometheus Operator across namespaces.
#
# Targets ONLY services that expose a Prometheus /metrics endpoint so Prometheus
# does not report permanently DOWN 404 scrape targets:
#   - mapping-proposal  (port 8000, /metrics: proposals by status, AI runs, queue, SFTP)
#   - mapping-converter (port 8000, /metrics: approvals, AI review decisions, conversions)
#
# Note:
#   - frontend (NGINX static proxy), version-control-backend & runtime-backend
#     (Spring Boot without micrometer-registry-prometheus), and sftp-shared /
#     sftp-runtime (SFTPGo telemetryd disabled) are monitored via kubelet/cAdvisor
#     (CPU, RAM, Network, Disk), kube-state-metrics (replicas, restarts, readiness),
#     and Loki container logs.
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: essers-mapping-services
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: essers-mapping
spec:
  namespaceSelector:
    matchNames:
      - essers-mapping-testing
      - essers-mapping-production
      - essers-mapping
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - mapping-proposal
          - mapping-converter
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        # Derive `cluster` ("testing" / "production") from the Kubernetes namespace
        - sourceLabels: [__meta_kubernetes_namespace]
          regex: essers-mapping-(testing|production)
          targetLabel: cluster
          replacement: "$1"
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          targetLabel: service
