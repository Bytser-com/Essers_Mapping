# ==============================================================================
# SERVICEMONITOR: NGINX INGRESS CONTROLLER
# Scrapes Prometheus metrics from the NGINX Ingress Controller (traffic, status codes, latency)
# Requires `controller.metrics.enabled: true` in ingress-nginx Helm values.
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingress-nginx-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: ingress-nginx
spec:
  namespaceSelector:
    matchNames:
      - ingress-nginx
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
