# ==============================================================================
# PROMETHEUS & GRAFANA MONITORING HELM VALUES — PRODUCTION ENVIRONMENT
# Chart: prometheus-community/kube-prometheus-stack
# Target: Production Cluster (MetalLB Ingress IP: 192.168.100.201)
# ==============================================================================
# Install command:
#   # 1. Create admin secret first (or let Helm generate it):
#   kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic grafana-admin-credentials \
#     --namespace monitoring \
#     --from-literal=admin-user=essers-admin \
#     --from-literal=admin-password="REPLACE_WITH_STRONG_PRODUCTION_SECRET" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # 2. Deploy or upgrade kube-prometheus-stack:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring \
#     --create-namespace \
#     -f Kubernetes/cluster-addons/monitoring/values-production.yaml
# ==============================================================================

# Global configuration
nameOverride: "k8s-mon"
fullnameOverride: "kube-prometheus-stack"

# ------------------------------------------------------------------------------
# 1. GRAFANA DASHBOARD PLATFORM (PRODUCTION)
# ------------------------------------------------------------------------------
grafana:
  enabled: true
  replicas: 1

  # Ensure Grafana runs on dedicated worker nodes
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

  # Admin credentials linked to dedicated Kubernetes Secret
  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password

  # Pod Disruption Budget to guarantee high availability during node drain
  podDisruptionBudget:
    minAvailable: 1

  # Hardened security context compliant with Pod Security Standards (Restricted)
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Ingress routing via NGINX Ingress Controller on 192.168.100.201
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    hosts:
      - grafana.essers.example.com
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: grafana-production-tls
        hosts:
          - grafana.essers.example.com

  # Persistent storage via Longhorn (Production: 20Gi RWO)
  persistence:
    type: pvc
    enabled: true
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    finalizers:
      - kubernetes.io/pvc-protection

  # Production resource allocation
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Automatic Dashboards & Datasources discovery via GitOps ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: k8s-sidecar-target-directory
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  grafana.ini:
    server:
      root_url: "https://grafana.essers.example.com"
      serve_from_sub_path: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
    security:
      cookie_secure: true
      cookie_samesite: lax
      disable_gravatar: true
      allow_embedding: false
      strict_transport_security: true
      strict_transport_security_max_age_seconds: 31536000
      strict_transport_security_subdomains: true
      x_content_type_options: true
      x_xss_protection: true
    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Viewer

# ------------------------------------------------------------------------------
# 2. PROMETHEUS TIME-SERIES METRICS ENGINE (PRODUCTION)
# ------------------------------------------------------------------------------
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1
    retention: 30d
    retentionSize: 45Gi

    nodeSelector:
      node-role.kubernetes.io/worker: "worker"

    # Scrape ServiceMonitors and PodMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}

    # Enable Prometheus Remote-Write receiver for Grafana Alloy push metrics
    enableRemoteWriteReceiver: true

    # Scrape intervals
    scrapeInterval: 15s
    evaluationInterval: 15s

    # Production Persistent Storage using Longhorn (Production: 50Gi)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Production resource sizing
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1500m
        memory: 4Gi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

# ------------------------------------------------------------------------------
# 3. ALERTMANAGER (PRODUCTION)
# ------------------------------------------------------------------------------
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1
    retention: 240h

    nodeSelector:
      node-role.kubernetes.io/worker: "worker"

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ------------------------------------------------------------------------------
# 4. KUBE-STATE-METRICS & EXPORTERS (CLUSTER INFRASTRUCTURE TELEMETRY)
# ------------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

# Pre-packaged Core Kubernetes Dashboards
defaultRules:
  create: true
  rules:
    etcd: false
