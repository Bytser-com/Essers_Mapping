# ==============================================================================
# NGINX INGRESS CONTROLLER HELM VALUES — PRODUCTION (192.168.100.201)
# Binds the NGINX Ingress Controller LoadBalancer Service to MetalLB IP 192.168.100.201
# on ports 80 (HTTP -> 443 Redirect) and 443 (HTTPS SSL Termination).
#
# Install command:
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#   helm repo update
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     --namespace ingress-nginx \
#     --create-namespace \
#     -f Kubernetes/cluster-addons/ingress-nginx/values-production.yaml
# ==============================================================================
controller:
  replicaCount: 2
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
    controllerValue: "k8s.io/ingress-nginx"
  service:
    type: LoadBalancer
    loadBalancerIP: "192.168.100.201"
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.100.201"
    ports:
      http: 80
      https: 443
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    proxy-body-size: "50m"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
