# ==============================================================================
# RUNTIME STAGE — SFTPGo FILE SHARE (`sftp-runtime`)
# - Powered by `drakkan/sftpgo:v2.6` backed by a Longhorn `ReadWriteMany` (RWX) PVC
# - Multi-replica safe (2+ replicas + HPA up to 5):
#   Because `sftp-runtime-pvc` uses Longhorn `ReadWriteMany` (`RWX`), multiple
#   `sftp-runtime` pods can run concurrently and share `/srv/sftpgo` (host keys,
#   config, and uploaded files) with zero storage conflicts!
# - Publicly reachable on its own dedicated IP:
#     * Testing:    192.168.100.103 (Port 22 SFTP / Port 8080 WebClient & Admin)
#     * Production: 192.168.100.203 (Port 22 SFTP / Port 8080 WebClient & Admin)
# - Inside the cluster: Reachable EXCLUSIVELY by `runtime-backend` (Java Spring Boot).
#   Preparation Stage workloads are strictly blocked by Calico NetworkPolicy.
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftp-runtime-pvc
  labels:
    app.kubernetes.io/name: sftp-runtime
    app.kubernetes.io/component: sftpgo-server
    essers.io/zone: runtime
spec:
  storageClassName: longhorn
  accessModes:
    # Longhorn ReadWriteMany (RWX) allows 2+ sftp-runtime replicas + runtime-backend
    # replicas to read/write the volume simultaneously without storage locks!
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp-runtime
  labels:
    app.kubernetes.io/name: sftp-runtime
    app.kubernetes.io/component: sftpgo-server
    app.kubernetes.io/tier: storage
    essers.io/zone: runtime
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sftp-runtime
      essers.io/zone: runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sftp-runtime
        app.kubernetes.io/component: sftpgo-server
        app.kubernetes.io/tier: storage
        essers.io/zone: runtime
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-sftpgo-dirs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /srv/sftpgo/data /srv/sftpgo/config /srv/sftpgo/backups
          volumeMounts:
            - name: runtime-data
              mountPath: /srv/sftpgo
      containers:
        - name: sftpgo
          image: drakkan/sftpgo:v2.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: sftp
              containerPort: 2022
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SFTPGO_SFTPD__BINDINGS__0__PORT
              value: "2022"
            - name: SFTPGO_HTTPD__BINDINGS__0__PORT
              value: "8080"
            - name: SFTPGO_HTTPD__BINDINGS__0__ADDRESS
              value: "0.0.0.0"
            # Store SFTPGo SQLite DB & SSH host keys on the shared Longhorn RWX volume
            - name: SFTPGO_DATA_PROVIDER__DRIVER
              value: "sqlite"
            - name: SFTPGO_DATA_PROVIDER__NAME
              value: "/srv/sftpgo/config/sftpgo.db"
            - name: SFTPGO_DATA_PROVIDER__USERS_BASE_DIR
              value: "/srv/sftpgo/data"
            - name: SFTPGO_DATA_PROVIDER__BACKUP_PATH
              value: "/srv/sftpgo/backups"
            - name: SFTPGO_SFTPD__HOST_KEYS
              value: "/srv/sftpgo/config/id_rsa,/srv/sftpgo/config/id_ecdsa,/srv/sftpgo/config/id_ed25519"
            - name: SFTPGO_DEFAULT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sftp-runtime-credentials
                  key: SFTPGO_DEFAULT_ADMIN_USERNAME
            - name: SFTPGO_DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sftp-runtime-credentials
                  key: SFTPGO_DEFAULT_ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: runtime-data
              mountPath: /srv/sftpgo
      volumes:
        - name: runtime-data
          persistentVolumeClaim:
            claimName: sftp-runtime-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-runtime
  labels:
    app.kubernetes.io/name: sftp-runtime
    app.kubernetes.io/component: sftpgo-server
    essers.io/zone: runtime
  annotations:
    # Overridden per environment in overlays/testing (192.168.100.103) & overlays/production (192.168.100.203)
    metallb.universe.tf/loadBalancerIPs: "192.168.100.103"
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.100.103"
  ports:
    # External & internal SFTP port 22 mapped cleanly to SFTPGo's non-root container port 2022
    - name: sftp
      port: 22
      targetPort: sftp
      protocol: TCP
    # SFTPGo Web Admin / WebClient UI & REST API port
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: sftp-runtime
    essers.io/zone: runtime
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sftp-runtime-pdb
  labels:
    essers.io/zone: runtime
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sftp-runtime
      essers.io/zone: runtime
