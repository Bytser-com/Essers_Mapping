# ==============================================================================
# RUNTIME STAGE — JAVA SPRING BOOT BACKEND: RUNTIME (`runtime-backend`)
# - Internal ClusterIP ONLY (Does NOT need to be publicly available)
# - Access:
#     * sftp-shared  (Shared-Storage Zone) -> ALLOWED (Read/Write)
#     * sftp-runtime (Runtime Zone)        -> ALLOWED (Read/Write - Exclusive inside cluster)
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-backend-sa
  labels:
    app.kubernetes.io/name: runtime-backend
    essers.io/zone: runtime
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-backend
  labels:
    app.kubernetes.io/name: runtime-backend
    app.kubernetes.io/component: spring-boot-backend
    app.kubernetes.io/tier: backend
    essers.io/zone: runtime
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-backend
      essers.io/zone: runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runtime-backend
        app.kubernetes.io/component: spring-boot-backend
        app.kubernetes.io/tier: backend
        essers.io/zone: runtime
        # Matched by NetworkPolicy 'allow-all-authorized-and-public-to-sftp-shared'
        essers.io/sftp-shared-access: "true"
        # Matched by NetworkPolicy 'allow-runtime-backend-and-public-to-sftp-runtime'
        essers.io/sftp-runtime-access: "true"
    spec:
      serviceAccountName: runtime-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime-backend
          image: ghcr.io/bytser-com/essers_mapping/runtime-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: SERVICE_NAME
              value: "runtime-backend"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: SFTP_SHARED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sftp-shared-credentials
                  key: SFTP_PASSWORD
            - name: SFTP_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sftp-runtime-credentials
                  key: SFTP_PASSWORD
            - name: SHARED_MOUNT_PATH
              value: "/mnt/sftp-shared"
            - name: RUNTIME_MOUNT_PATH
              value: "/mnt/sftp-runtime"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            # 1. Shared SFTP file share (in-between shared-storage zone)
            - name: shared-files
              mountPath: /mnt/sftp-shared
              readOnly: false
            # 2. Runtime SFTP file share (exclusive runtime zone)
            - name: runtime-files
              mountPath: /mnt/sftp-runtime
              readOnly: false
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: shared-files
          persistentVolumeClaim:
            claimName: sftp-shared-pvc
        - name: runtime-files
          persistentVolumeClaim:
            claimName: sftp-runtime-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-backend
  labels:
    app.kubernetes.io/name: runtime-backend
    app.kubernetes.io/component: spring-boot-backend
    app.kubernetes.io/tier: backend
    essers.io/zone: runtime
spec:
  # Internal ClusterIP ONLY (Not publicly exposed)
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: runtime-backend
    essers.io/zone: runtime
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runtime-backend-pdb
  labels:
    essers.io/zone: runtime
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-backend
      essers.io/zone: runtime
