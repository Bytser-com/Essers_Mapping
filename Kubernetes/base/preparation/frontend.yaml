# ==============================================================================
# PREPARATION STAGE: NGINX FRONTEND + API REVERSE PROXY (Internal Port 8080)
# - Reached via `essers-frontend-ingress` (NGINX Ingress Controller handles
#   port 80 -> 443 redirect & Let's Encrypt / cert-manager TLS termination at edge)
# - Listens on plain HTTP port 8080 inside the private Kubernetes network
# - Serves static frontend assets AND proxies `/api/*` requests internally to:
#     * /api/converter/*       -> http://mapping-converter:8000/
#     * /api/proposal/*        -> http://mapping-proposal:8000/
#     * /api/version-control/* -> http://version-control-backend:8080/
# - Strictly proxied: No direct access to SFTP (requests files via backend APIs).
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  labels:
    app.kubernetes.io/name: frontend
    essers.io/zone: preparation
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  labels:
    app.kubernetes.io/name: frontend
    essers.io/zone: preparation
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        client_max_body_size 50M;

        # Serve Frontend SPA (Vite / React / Vue build)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Healthcheck endpoint for Kubernetes probes
        location = /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Proxy /api/converter/* -> Python Backend 1 (mapping-converter)
        location /api/converter/ {
            proxy_pass http://mapping-converter:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Proxy /api/proposal/* -> Python Backend 2 (mapping-proposal)
        location /api/proposal/ {
            proxy_pass http://mapping-proposal:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Proxy /api/version-control/* -> Java Spring Boot Backend (version-control-backend)
        location /api/version-control/ {
            proxy_pass http://version-control-backend:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: nginx-frontend
    app.kubernetes.io/tier: frontend
    essers.io/zone: preparation
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      essers.io/zone: preparation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: nginx-frontend
        app.kubernetes.io/tier: frontend
        essers.io/zone: preparation
    spec:
      serviceAccountName: frontend-sa
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # TEMPORARY PLACEHOLDER: Un-comment when ghcr.io image is built and pushed
          # image: ghcr.io/bytser-com/essers_mapping/frontend:latest
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["echo healthy > /tmp/healthz && exec httpd -f -p 8080 -h /tmp"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: SERVICE_NAME
              value: "frontend"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: nginx-frontend
    app.kubernetes.io/tier: frontend
    essers.io/zone: preparation
spec:
  # Internal ClusterIP on plain HTTP port 8080 — external HTTPS (443) and HTTP (80)
  # redirect are terminated at the edge by `essers-frontend-ingress` (ingress-nginx).
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: frontend
    essers.io/zone: preparation
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  labels:
    essers.io/zone: preparation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      essers.io/zone: preparation
