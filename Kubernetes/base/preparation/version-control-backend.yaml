# ==============================================================================
# PREPARATION STAGE — JAVA SPRING BOOT BACKEND: VERSION CONTROL
# - Internal ClusterIP ONLY (NOT publicly exposed; proxied via Frontend `/api/version-control/*`)
# - Access:
#     * sftp-shared (Shared-Storage Zone) -> ALLOWED (Read/Write)
#     * sftp-runtime (Runtime Zone)       -> BLOCKED
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: version-control-backend-sa
  labels:
    app.kubernetes.io/name: version-control-backend
    essers.io/zone: preparation
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: version-control-backend
  labels:
    app.kubernetes.io/name: version-control-backend
    app.kubernetes.io/component: spring-boot-backend
    app.kubernetes.io/tier: backend
    essers.io/zone: preparation
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: version-control-backend
      essers.io/zone: preparation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: version-control-backend
        app.kubernetes.io/component: spring-boot-backend
        app.kubernetes.io/tier: backend
        essers.io/zone: preparation
        # Only accesses sftp-shared (NOT sftp-runtime)
        essers.io/sftp-shared-access: "true"
    spec:
      serviceAccountName: version-control-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: version-control-backend
          # TODO: Replace with your real image (e.g. ghcr.io/bytser-com/essers_mapping/version-control-backend)
          image: ghcr.io/bytser-com/essers_mapping/version-control-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: SERVICE_NAME
              value: "version-control-backend"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: SFTP_SHARED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sftp-shared-credentials
                  key: SFTP_PASSWORD
            - name: SHARED_MOUNT_PATH
              value: "/mnt/sftp-shared"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            # Shared SFTP file share (Read/Write for all Preparation & Runtime workloads)
            - name: shared-files
              mountPath: /mnt/sftp-shared
              readOnly: false
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: shared-files
          persistentVolumeClaim:
            claimName: sftp-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: version-control-backend
  labels:
    app.kubernetes.io/name: version-control-backend
    app.kubernetes.io/component: spring-boot-backend
    app.kubernetes.io/tier: backend
    essers.io/zone: preparation
spec:
  # Strictly internal ClusterIP — all external requests are proxied by `frontend` on `/api/version-control/*`
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: version-control-backend
    essers.io/zone: preparation
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: version-control-backend-pdb
  labels:
    essers.io/zone: preparation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: version-control-backend
      essers.io/zone: preparation
