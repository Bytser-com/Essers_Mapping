# ==============================================================================
# PLACEHOLDER SECRETS TEMPLATE (GHCR Image Pull Secret & SFTPGo Credentials)
# In CI/CD or Production, inject real values via GitHub Actions Secrets,
# SealedSecrets, or External Secrets Operator before or during deployment.
# ==============================================================================
# 1. GitHub Container Registry (ghcr.io/bytser-com/essers_mapping/*) Pull Secret
#    Required if your repository/packages are private.
#    Can also be created via CLI:
#      kubectl create secret docker-registry ghcr-pull-secret \
#        --docker-server=ghcr.io \
#        --docker-username=<github-username> \
#        --docker-password=<github-pat-with-read-packages>
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  labels:
    app.kubernetes.io/component: registry-auth
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "GITHUB_USERNAME_OR_ACTOR",
          "password": "CHANGE_ME_GITHUB_TOKEN_OR_PAT"
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: sftp-shared-credentials
  labels:
    app.kubernetes.io/component: sftp-shared
    essers.io/zone: shared-storage
type: Opaque
stringData:
  # SFTPGo Default Admin Credentials (for Web Admin UI / REST API)
  SFTPGO_DEFAULT_ADMIN_USERNAME: "admin"
  SFTPGO_DEFAULT_ADMIN_PASSWORD: "CHANGE_ME_SHARED_ADMIN_PASSWORD"
  # SFTP Client Credentials for Backends & Frontend
  SFTP_USER: "shareduser"
  SFTP_PASSWORD: "CHANGE_ME_SHARED_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: sftp-runtime-credentials
  labels:
    app.kubernetes.io/component: sftp-runtime
    essers.io/zone: runtime
type: Opaque
stringData:
  # SFTPGo Default Admin Credentials (for Web Admin UI / REST API)
  SFTPGO_DEFAULT_ADMIN_USERNAME: "admin"
  SFTPGO_DEFAULT_ADMIN_PASSWORD: "CHANGE_ME_RUNTIME_ADMIN_PASSWORD"
  # SFTP Client Credentials (Restricted inside cluster exclusively to runtime-backend)
  SFTP_USER: "runtimeuser"
  SFTP_PASSWORD: "CHANGE_ME_RUNTIME_PASSWORD"
